  text: The data are the achieved position of TF 12 an TF 13 after landing. Data are aligned to SSAT target. The ILIS points measures are from the  SSAT BR measures best fitted to ABH fiducials.
- col: 7
  row: 139
  text: The data are the achieved position of TF 12 an TF 13 after TFGS Landing. CCL's, ILIS points and some Fiducials are aligned to In Pit measured position . The ILIS points measures are from the the target Inpit measures best fitted to ABH fiducials. Th fiducial coordinates are seperated between the "measured Fiducials"and "best Fitted Fiducial"
- col: 12
  row: 139
  text: The data are the achieved position of TF 12 an TF 13 after realignment in pit due to the central collumn movment during sector 06 landing. CCL's, ILIS points and some Fiducials are aligned to In Pit measured position . The fiducial coordinates are seperated between the "measured Fiducials"and "best Fitted Fiducial"
