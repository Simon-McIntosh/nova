    <figcaption>Weak-rotation reactor static fixture, requested −110 and realized 135 cells, exact clipping, CPU binary64. One production map application to the analytic state: sup residual 0.0082461751126 Wb over all 772 nodes, 0.00815412499525 Wb over cell nodes, and 1.65922893e−4 relative to the analytic sup. Positive central residual, negative upper and lower outboard caps (dashed contours). Black large and blue small triangles mark the sampled analytic and mapped axes in both flux panels; neither field admits a saddle. No solve ran, so terminal convergence is not applicable. <a href="/nova/figures/centroid-constrained-oracle-solve/root-cause/closed-forms/map-residual.json">Per-cell residual and centroid receipt</a>; <a href="/nova/figures/centroid-constrained-oracle-solve/root-cause/closed-forms/analytic-map-residual.svg">vector figure</a>.</figcaption>
  </figure>
  <figure>
    <img src="/nova/figures/centroid-constrained-oracle-solve/root-cause/closed-forms/unit-field-closed-forms.png" alt="Coincident code and closed-form flux contours for unit vertical and radial fields, with the vessel">
    <figcaption>Blue solid contours are the bounded unknown’s flux response; black dashed contours are independently evaluated total-flux closed forms: π(R²−6.2²) Wb for unit vertical field and −2πRZ Wb for unit radial field. Both have scale +1 and zero spatial error; the complete exterior path agrees within 2.84e−14 Wb. The radial column also has B_Z=−Z/R T. Neither unit field has a null at R&gt;0. These are unit basis responses; the bound guard refuses either as a 1 T command. Fresh local centroid cancellation predicts +3.78684 mT, versus the banked converged −21.25581 mT; that discrepancy survives the flux-column check. <a href="/nova/figures/centroid-constrained-oracle-solve/root-cause/closed-forms/field-response.json">Field receipt and instrument controls</a>; <a href="/nova/figures/centroid-constrained-oracle-solve/root-cause/closed-forms/unit-field-closed-forms.svg">vector figure</a>.</figcaption>
  </figure>
