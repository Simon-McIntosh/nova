  <figcaption>Training: 131 shots; held out: 37 shots and 1,417,011 supported observations, split fixed before scoring. Each point is one excluded shot; points below the dotted equality line improve. With measured drives, pooled RMS falls from 6.4014 to 5.6355 mT (22.4989% lower squared residual); with cross-shot permuted drives, 32.1174 to 32.0706 mT (0.2911% lower squared residual). The strict control requires no held-out improvement under permutation and fails: retain nominal seeds, no parameter promoted. Both nominal and fitted models calibrate all 13 bounded drive scales on training shots only. The leading resistance direction reaches its nominal interval boundary: coil-case resistivity 0.900 µΩ m versus seed 0.740 and interval [0.690, 0.900] µΩ m. All 50 circuit resistances remain inside their intervals to floating-point precision; all decay rates are positive, minimum 16.0135 s⁻¹. The 386.98 µT sensor floor, excluded rod/ground circuits, assumed vertical-drive intervals and zero initial passive current remain model limitations. <a href="/nova/figures/mast-passive-held-out/receipt.json">Measurement receipt</a>; <a href="/nova/figures/mast-passive-held-out/split.json">Declared shot split</a>.</figcaption>
