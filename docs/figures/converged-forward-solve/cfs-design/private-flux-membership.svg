<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" width="1400" height="700" role="img" aria-labelledby="title description">
<title id="title">Flux level does not determine axis-connected membership</title>
<desc id="description">Two schematic copies of a diverted region inside a vessel. The upper lobe contains the magnetic axis, the lower private lobe does not. Both satisfy the same signed flux inequality. A hex cell across the saddle contains pieces of both lobes. Correct current booking keeps only its upper, axis-connected piece; touching at the saddle does not connect the interiors.</desc>
<g font-family="system-ui, sans-serif" fill="#171717" font-size="27" text-anchor="middle">
<text x="350" y="42">Level test alone</text><text x="1030" y="42">Axis-connected sub-cell membership</text>
</g>
