<circle cx="1030" cy="450" r="7" fill="white"/>
</g>
<g font-family="system-ui, sans-serif" fill="#171717" font-size="25" text-anchor="middle">
<text x="350" y="278">axis-connected core</text><text x="1030" y="278">axis-connected core</text>
<text x="350" y="540">private flux</text><text x="1030" y="540">private flux</text>
<text x="350" y="650">Both pieces pass σ(ψ − ψ<tspan baseline-shift="sub" font-size="18">b</tspan>) ≥ 0</text>
<text x="1030" y="650">Lower piece: zero plasma current</text>
<text x="700" y="393" font-size="23">one hex cell</text><text x="700" y="427" font-size="23">two components</text>
<text x="700" y="690" font-size="23">Schematic, not a computed flux map. Contact at the saddle does not join the open interiors.</text>
</g>
