<polyline points="90.0,117.6 160.0,97.3 300.0,87.9 580.0,80.0" fill="none" stroke="#d97706" stroke-width="3"/>
<text x="590.0" y="102.7" fill="#2563eb">cpu: 125.211 windows/s</text>
