<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-label="Coupled-window batch throughput">
<style>:root{color-scheme:light dark}text{font-family:system-ui,sans-serif;font-size:14px;fill:currentColor}.title{font-size:20px;font-weight:650}.axis{stroke:#64748b;stroke-width:1}</style>
<text x="40" y="35" class="title">Admitted member-window throughput</text>
