<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 620" role="img" aria-labelledby="title desc">
  <title id="title">Parareal across converged waveform-relaxation windows</title>
  <desc id="desc">A serial frozen-geometry TORAX predictor supplies eight window boundaries. Each parallel fine window runs the full equilibrium and TORAX waveform exchange to a receipted fixed point. A serial correction carries continuous state on the explicit coordinate map and threads branch history without algebraically blending topology.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#345995"/>
    </marker>
    <marker id="coarse-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#a45a10"/>
    </marker>
  </defs>
  <g font-family="system-ui, sans-serif" fill="#17212b">
    <text x="42" y="38" font-size="20" font-weight="650">Recommended composition: Parareal outside converged coupled windows</text>
    <text x="42" y="67" font-size="13">Only the expensive fine windows run concurrently; the coarse predictor and boundary correction remain causal.</text>

    <text x="42" y="120" font-size="15" font-weight="650">serial predictor</text>
    <g fill="#fff8ed" stroke="#a45a10" stroke-width="1.4">
      <circle cx="225" cy="115" r="12"/>
      <circle cx="360" cy="115" r="12"/>
      <circle cx="495" cy="115" r="12"/>
      <circle cx="630" cy="115" r="12"/>
      <circle cx="765" cy="115" r="12"/>
      <circle cx="900" cy="115" r="12"/>
      <circle cx="1035" cy="115" r="12"/>
      <circle cx="1170" cy="115" r="12"/>
      <circle cx="1305" cy="115" r="12"/>
    </g>
    <g stroke="#a45a10" stroke-width="1.4" fill="none" marker-end="url(#coarse-arrow)">
      <path d="M237,115 H347"/><path d="M372,115 H482"/><path d="M507,115 H617"/>
      <path d="M642,115 H752"/><path d="M777,115 H887"/><path d="M912,115 H1022"/>
      <path d="M1047,115 H1157"/><path d="M1182,115 H1292"/>
    </g>
    <text x="225" y="151" text-anchor="middle" font-size="12">u₀</text>
    <text x="690" y="151" text-anchor="middle" font-size="12">frozen-geometry TORAX coarse steps · full four-channel state</text>

    <text x="42" y="210" font-size="15" font-weight="650">parallel fine phase</text>
    <g fill="#f4f8fc" stroke="#345995" stroke-width="1.4">
      <rect x="180" y="185" width="118" height="216" rx="5"/>
      <rect x="315" y="185" width="118" height="216" rx="5"/>
      <rect x="450" y="185" width="118" height="216" rx="5"/>
      <rect x="585" y="185" width="118" height="216" rx="5"/>
      <rect x="720" y="185" width="118" height="216" rx="5"/>
      <rect x="855" y="185" width="118" height="216" rx="5"/>
      <rect x="990" y="185" width="118" height="216" rx="5"/>
      <rect x="1125" y="185" width="118" height="216" rx="5"/>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="239" y="211" font-weight="650">fine window 1</text>
      <text x="374" y="211" font-weight="650">fine window 2</text>
      <text x="509" y="211" font-weight="650">fine window 3</text>
      <text x="644" y="211" font-weight="650">fine window 4</text>
      <text x="779" y="211" font-weight="650">fine window 5</text>
      <text x="914" y="211" font-weight="650">fine window 6</text>
      <text x="1049" y="211" font-weight="650">fine window 7</text>
      <text x="1184" y="211" font-weight="650">fine window 8</text>
    </g>
    <g font-size="11.5" text-anchor="middle">
      <text x="239" y="248">equilibrium + FSA</text><text x="239" y="279">⇅ waveform</text><text x="239" y="310">TORAX step</text>
      <text x="374" y="248">equilibrium + FSA</text><text x="374" y="279">⇅ waveform</text><text x="374" y="310">TORAX step</text>
      <text x="509" y="248">equilibrium + FSA</text><text x="509" y="279">⇅ waveform</text><text x="509" y="310">TORAX step</text>
      <text x="644" y="248">equilibrium + FSA</text><text x="644" y="279">⇅ waveform</text><text x="644" y="310">TORAX step</text>
      <text x="779" y="248">equilibrium + FSA</text><text x="779" y="279">⇅ waveform</text><text x="779" y="310">TORAX step</text>
      <text x="914" y="248">equilibrium + FSA</text><text x="914" y="279">⇅ waveform</text><text x="914" y="310">TORAX step</text>
      <text x="1049" y="248">equilibrium + FSA</text><text x="1049" y="279">⇅ waveform</text><text x="1049" y="310">TORAX step</text>
      <text x="1184" y="248">equilibrium + FSA</text><text x="1184" y="279">⇅ waveform</text><text x="1184" y="310">TORAX step</text>
    </g>
    <g font-size="11" text-anchor="middle" fill="#345995">
      <text x="239" y="348">fixed point + receipts</text><text x="239" y="375">vmap across windows</text>
      <text x="374" y="348">fixed point + receipts</text><text x="374" y="375">vmap across windows</text>
      <text x="509" y="348">fixed point + receipts</text><text x="509" y="375">vmap across windows</text>
      <text x="644" y="348">fixed point + receipts</text><text x="644" y="375">vmap across windows</text>
      <text x="779" y="348">fixed point + receipts</text><text x="779" y="375">vmap across windows</text>
      <text x="914" y="348">fixed point + receipts</text><text x="914" y="375">vmap across windows</text>
      <text x="1049" y="348">fixed point + receipts</text><text x="1049" y="375">vmap across windows</text>
      <text x="1184" y="348">fixed point + receipts</text><text x="1184" y="375">vmap across windows</text>
    </g>

    <path d="M180,450 H1243" stroke="#345995" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
    <text x="42" y="455" font-size="15" font-weight="650">serial correction</text>
    <text x="180" y="486" font-size="13">continuous correction after common-grid resampling</text>
    <text x="180" y="512" font-size="13">branch history passes causally; topology is never blended</text>
    <text x="180" y="538" font-size="13">any invalid geometry, branch mismatch, or unconverged fine window raises</text>

    <path d="M1243,450 C1310,450 1310,88 1260,88" stroke="#345995" stroke-width="1.4" fill="none" marker-end="url(#arrow)"/>
    <text x="1000" y="576" font-size="12">repeat until the outer correction receipt meets tolerance</text>
  </g>
</svg>
