<text x="62" y="650" class="verdict">connectivity_boundary — SINGLE IMPLEMENTATION RELOCATION</text>
<text x="62" y="672" class="summary">Host entries prepare and materialise the traced kernels; hard exact topology and smooth differentiability remain intentional semantic routes.</text>
<text x="62" y="702" class="verdict">flux_surface_connectivity — DELETE ONE, THEN RELOCATE</text>
<text x="62" y="724" class="summary">Delete unused flux_surface_bins; retain and relocate the fixed-shape kernel and its shared flood primitive.</text>
