    </g>
    <line x1="34" x2="1488" y1="431" y2="431" stroke="#edf1f7"/>
    <g transform="translate(0 437)">
      <text class="item" x="34" y="19">subnull signature</text>
      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#dbeafe"/><text class="tag" x="66" y="14" fill="#2563eb">COLLAPSE</text></g>
      <text class="evidence" x="540" y="19">Three coordinate arrays → [r, z, psi, type] · exact max difference 0 · GPU ratio 0.71–1.33×</text>
