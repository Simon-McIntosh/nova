      <text class="alert-label" x="16" y="19">REPAIR BOUNDARY</text>
      <text class="alert-text" x="16" y="37">Enable fp64 before the first select trace</text>
    </g>
    <text class="column" x="34" y="86">LOGICAL PAIR</text>
    <text class="column" x="368" y="86">DISPOSITION</text>
    <text class="column" x="540" y="86">DECISIVE MEASUREMENT OR SEMANTIC BOUNDARY</text>

    <g transform="translate(0 101)">
