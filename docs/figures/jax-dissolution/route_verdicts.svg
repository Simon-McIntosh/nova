      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#ccfbf1"/><text class="tag" x="66" y="14" fill="#0f766e">KEEP BOTH</text></g>
      <text class="evidence" x="540" y="19">Matrix evaluator is not the host geometry container · 3 importers · max scaled error 2.03e−7</text>
    </g>
    <line x1="34" x2="1488" y1="216" y2="216" stroke="#edf1f7"/>
    <g transform="translate(0 222)">
