<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="905" viewBox="0 0 1540 905" role="img" aria-labelledby="title desc">
  <title id="title">Measured JAX route dispositions</title>
  <desc id="desc">A compact analytical table of twenty measured route decisions grouped by select, null stack, fixed point, stencil nulls, and connectivity.</desc>
  <style>
    text { font-family: 'DejaVu Sans', sans-serif; fill: #1f2937; }
    .column { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; fill: #64748b; }
    .group { font-size: 14px; font-weight: 800; letter-spacing: 1.1px; fill: #111827; }
    .group-meta { font-size: 12px; font-weight: 500; letter-spacing: 0; fill: #64748b; }
    .route { font-size: 15px; font-weight: 650; }
    .basis { font-size: 14px; font-weight: 450; fill: #334155; }
    .condition { font-size: 13px; font-weight: 450; fill: #526078; }
    .decision { font-size: 13px; font-weight: 800; letter-spacing: .35px; }
    .keep { fill: #0f766e; }
    .collapse { fill: #1d4ed8; }
    .delete { fill: #be123c; }
    .relocate { fill: #a16207; }
    .rule { stroke: #cbd5e1; stroke-width: 1; shape-rendering: crispEdges; }
    .footer { font-size: 12px; fill: #64748b; }
  </style>

  <text class="column" x="36" y="24">ROUTE OR LOGICAL PAIR</text>
  <text class="column" x="340" y="24">DISPOSITION</text>
  <text class="column" x="475" y="24">MEASURED BASIS</text>
  <text class="column" x="1015" y="24">CONDITION OR SEMANTIC BOUNDARY</text>

  <g aria-label="Select decisions">
    <text class="group" x="36" y="57">SELECT <tspan class="group-meta">· 9 decisions</tspan></text>
    <line class="rule" x1="218" y1="52" x2="1504" y2="52"/>

    <text class="route" x="36" y="86">select module</text>
    <text class="decision keep" x="340" y="86">KEEP BOTH</text>
    <text class="basis" x="475" y="86">fp32: 12/18 class mismatches · fp64: 0/18</text>
    <text class="condition" x="1015" y="86">fp64 is the measured workaround; reduced precision remains unresolved</text>

    <text class="route" x="36" y="116">bisect</text>
    <text class="decision delete" x="340" y="116">DELETE</text>
    <text class="basis" x="475" y="116">0 traced callers · traced cost 18–874× host</text>
    <text class="condition" x="1015" y="116">retain Python-compatible host bisection</text>

    <text class="route" x="36" y="146">right and vector bisection</text>
    <text class="decision delete" x="340" y="146">DELETE</text>
    <text class="basis" x="475" y="146">0 traced callers · traced routes unusable</text>
    <text class="condition" x="1015" y="146">retain the live host routes</text>

    <text class="route" x="36" y="176">wall arithmetic</text>
    <text class="decision collapse" x="340" y="176">COLLAPSE</text>
    <text class="basis" x="475" y="176">body differs only by array namespace</text>
    <text class="condition" x="1015" y="176">preserve backend-native zero-division behavior</text>

    <text class="route" x="36" y="206">wall fitting and selection</text>
    <text class="decision keep" x="340" y="206">KEEP BOTH</text>
    <text class="basis" x="475" y="206">host and traced execution contracts differ materially</text>
    <text class="condition" x="1015" y="206">branching, mutation, least-squares, NaN, fixed shape</text>

    <text class="route" x="36" y="236">quadratic surface fit</text>
    <text class="decision keep" x="340" y="236">KEEP BOTH</text>
    <text class="basis" x="475" y="236">host float64 fit differs from JAX device semantics</text>
    <text class="condition" x="1015" y="236">distinct numerical interfaces remain intentional</text>

    <text class="route" x="36" y="266">converged surface arithmetic</text>
    <text class="decision collapse" x="340" y="266">COLLAPSE</text>
    <text class="basis" x="475" y="266">fp64 max component error: CPU 2.30e−13 · GPU 1.09e−11</text>
    <text class="condition" x="1015" y="266">lock NaN sentinel and determinant-floor policy first</text>

    <text class="route" x="36" y="296">subnull composite</text>
    <text class="decision keep" x="340" y="296">KEEP BOTH</text>
    <text class="basis" x="475" y="296">host loops and traced vmap independently live</text>
    <text class="condition" x="1015" y="296">converge the public contract, not the execution bodies</text>

    <text class="route" x="36" y="326">subnull signature</text>
    <text class="decision collapse" x="340" y="326">COLLAPSE</text>
    <text class="basis" x="475" y="326">three-array and stacked results: exact max difference 0</text>
    <text class="condition" x="1015" y="326">retain flat [r, z, psi, type] output</text>
  </g>

  <g aria-label="Null stack decisions">
    <text class="group" x="36" y="371">NULL STACK <tspan class="group-meta">· 4 decisions · fp32 campaign</tspan></text>
    <line class="rule" x1="343" y1="366" x2="1504" y2="366"/>

    <text class="route" x="36" y="400">fieldnull</text>
    <text class="decision delete" x="340" y="400">DELETE</text>
    <text class="basis" x="475" y="400">traced wrapper: 0 callers · host class: 2 callers</text>
    <text class="condition" x="1015" y="400">retain host class, live kernels, and JAX-free boundary</text>

    <text class="route" x="36" y="430">null</text>
    <text class="decision keep" x="340" y="430">KEEP BOTH</text>
    <text class="basis" x="475" y="430">4 importers · 7 nonzero autodiff gradient entries</text>
    <text class="condition" x="1015" y="430">fixed-size derivatives vs adaptive state and filtering</text>

    <text class="route" x="36" y="460">target</text>
    <text class="decision keep" x="340" y="460">KEEP BOTH</text>
    <text class="basis" x="475" y="460">3 importers · max traced scaled error 2.03e−7</text>
    <text class="condition" x="1015" y="460">matrix evaluator is not the host geometry container</text>

    <text class="route" x="36" y="490">topology</text>
    <text class="decision keep" x="340" y="490">KEEP BOTH</text>
    <text class="basis" x="475" y="490">1 importer · max normalized route deviation 6.33e−4</text>
    <text class="condition" x="1015" y="490">fixed-shape kernel vs mutable adaptive state</text>
  </g>

  <g aria-label="Fixed-point decision">
    <text class="group" x="36" y="535">FIXED POINT <tspan class="group-meta">· 1 solver family</tspan></text>
    <line class="rule" x1="288" y1="530" x2="1504" y2="530"/>

    <text class="route" x="36" y="564">picard · anderson · newton_krylov</text>
    <text class="decision relocate" x="340" y="564">RELOCATE</text>
    <text class="basis" x="475" y="564">CPU won steady regimes · GPU 0.096–0.795× · rel sup 1.90e−13</text>
    <text class="condition" x="1015" y="564">one JAX family; no host peer; move intact to equilibrium</text>
  </g>

  <g aria-label="Stencil null decisions">
    <text class="group" x="36" y="609">STENCIL NULLS <tspan class="group-meta">· 4 decisions</tspan></text>
    <line class="rule" x1="280" y1="604" x2="1504" y2="604"/>

    <text class="route" x="36" y="638">ring_sign_changes</text>
    <text class="decision keep" x="340" y="638">KEEP BOTH</text>
    <text class="basis" x="475" y="638">rectangular reference exact · saddle masks differ by 1.32%</text>
    <text class="condition" x="1015" y="638">rectangular and hexagonal geometry contracts differ</text>

    <text class="route" x="36" y="668">subnull</text>
    <text class="decision collapse" x="340" y="668">COLLAPSE</text>
    <text class="basis" x="475" y="668">signature difference 0 · CPU near parity · GPU 503 vs 466 µs</text>
    <text class="condition" x="1015" y="668">use three arrays; adapt the stacked caller</text>

    <text class="route" x="36" y="698">magnetic_axis_subgrid</text>
    <text class="decision relocate" x="340" y="698">RELOCATE</text>
    <text class="basis" x="475" y="698">single implementation · max axis error 5.63e−4</text>
    <text class="condition" x="1015" y="698">repair requirement: reject a plateau before publishing found</text>

    <text class="route" x="36" y="728">xpoint_candidates</text>
    <text class="decision relocate" x="340" y="728">RELOCATE</text>
    <text class="basis" x="475" y="728">audit observed 99 candidates → 8 slots with silent overflow</text>
    <text class="condition" x="1015" y="728">repair audit in progress; expose overflow or prove the bound</text>
  </g>

  <g aria-label="Connectivity decisions">
    <text class="group" x="36" y="773">CONNECTIVITY <tspan class="group-meta">· 2 decisions</tspan></text>
    <line class="rule" x1="269" y1="768" x2="1504" y2="768"/>

    <text class="route" x="36" y="802">connectivity_boundary</text>
    <text class="decision relocate" x="340" y="802">RELOCATE</text>
    <text class="basis" x="475" y="802">adapter parity exact · flux 2.86e−6 · saddle 1.25e−5 m</text>
    <text class="condition" x="1015" y="802">retain hard topology and smooth differentiability</text>

    <text class="route" x="36" y="832">flux_surface_connectivity</text>
    <text class="decision delete" x="340" y="832">DELETE</text>
    <text class="basis" x="475" y="832">0-caller host adapter · flood and core masks exact</text>
    <text class="condition" x="1015" y="832">relocate traced core; endpoint errors remain 0.225 / 0.149</text>
  </g>

  <text class="footer" x="36" y="882">Measured routing evidence only. Dispositions separate implementation ownership from unresolved scientific-policy and repair questions.</text>
</svg>
