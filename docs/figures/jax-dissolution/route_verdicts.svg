<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1840" viewBox="0 0 1600 1840" role="img" aria-labelledby="title desc">
  <title id="title">Canonical JAX route dispositions</title>
  <desc id="desc">A five-group summary of twenty measured routing decisions for select, null stack, fixed point, stencil nulls, and connectivity. Eight routes keep both implementations, four collapse, four delete a duplicate, and four relocate a single implementation.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="masthead" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 48px 'DejaVu Sans', sans-serif; letter-spacing: -1px; fill: #fff; }
      .subtitle { font: 400 20px 'DejaVu Sans', sans-serif; fill: #dbeafe; }
      .meta { font: 500 15px 'DejaVu Sans Mono', monospace; fill: #bfdbfe; }
      .count { font: 800 25px 'DejaVu Sans', sans-serif; }
      .count-label { font: 700 14px 'DejaVu Sans', sans-serif; letter-spacing: .6px; }
      .group { font: 800 24px 'DejaVu Sans', sans-serif; fill: #172033; }
      .group-meta { font: 500 14px 'DejaVu Sans Mono', monospace; fill: #64748b; }
      .column { font: 700 12px 'DejaVu Sans', sans-serif; letter-spacing: 1.2px; fill: #7c8aa0; }
      .item { font: 700 16px 'DejaVu Sans', sans-serif; fill: #243047; }
      .symbols { font: 400 13px 'DejaVu Sans Mono', monospace; fill: #64748b; }
      .evidence { font: 500 15px 'DejaVu Sans', sans-serif; fill: #374151; }
      .note { font: 500 14px 'DejaVu Sans', sans-serif; fill: #526078; }
      .tag { font: 800 12px 'DejaVu Sans', sans-serif; letter-spacing: .6px; text-anchor: middle; dominant-baseline: middle; }
      .alert-label { font: 800 12px 'DejaVu Sans', sans-serif; letter-spacing: 1px; fill: #9a3412; }
      .alert-text { font: 700 14px 'DejaVu Sans', sans-serif; fill: #7c2d12; }
      .footer { font: 500 13px 'DejaVu Sans', sans-serif; fill: #64748b; }
    </style>
  </defs>

