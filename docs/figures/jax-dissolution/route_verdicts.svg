      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#dbeafe"/><text class="tag" x="66" y="14" fill="#2563eb">COLLAPSE</text></g>
      <text class="evidence" x="540" y="19">Array namespace is the only body difference · preserve backend zero-division semantics</text>
    </g>
    <line x1="34" x2="1488" y1="263" y2="263" stroke="#edf1f7"/>
    <g transform="translate(0 269)">
