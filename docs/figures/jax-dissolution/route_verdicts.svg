      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#ccfbf1"/><text class="tag" x="66" y="14" fill="#0f766e">KEEP BOTH</text></g>
      <text class="evidence" x="540" y="19">Different branching, mutation, least-squares, NaN, and fixed-shape contracts</text>
    </g>
    <line x1="34" x2="1488" y1="305" y2="305" stroke="#edf1f7"/>
    <g transform="translate(0 311)">
      <text class="item" x="34" y="19">quadratic surface fit</text>
      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#ccfbf1"/><text class="tag" x="66" y="14" fill="#0f766e">KEEP BOTH</text></g>
      <text class="evidence" x="540" y="19">Host float64 + gelsd contract differs from traced JAX precision and device semantics</text>
    </g>
    <line x1="34" x2="1488" y1="347" y2="347" stroke="#edf1f7"/>
    <g transform="translate(0 353)">
      <text class="item" x="34" y="19">converged surface arithmetic</text>
      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#dbeafe"/><text class="tag" x="66" y="14" fill="#2563eb">COLLAPSE</text></g>
      <text class="evidence" x="540" y="19">Only after NaN sentinel and determinant-floor policy are locked</text>
    </g>
    <line x1="34" x2="1488" y1="389" y2="389" stroke="#edf1f7"/>
    <g transform="translate(0 395)">
      <text class="item" x="34" y="19">subnull composite</text>
      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#ccfbf1"/><text class="tag" x="66" y="14" fill="#0f766e">KEEP BOTH</text></g>
