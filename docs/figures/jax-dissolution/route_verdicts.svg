      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#ccfbf1"/><text class="tag" x="66" y="14" fill="#0f766e">KEEP BOTH</text></g>
      <text class="evidence" x="540" y="19">fp32: 12/18 class mismatches on CPU and GPU · fp64: 0/18 · GPU max error 1.09e−11</text>
    </g>
    <line x1="34" x2="1488" y1="137" y2="137" stroke="#edf1f7"/>
    <g transform="translate(0 143)">
