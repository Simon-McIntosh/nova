  <circle cx="1405" cy="10" r="130" fill="#c4b5fd" opacity="0.10"/>

  <rect width="1600" height="220" fill="url(#masthead)"/>
  <text class="title" x="48" y="68">Canonical JAX route dispositions</text>
  <text class="subtitle" x="50" y="106">Independent measurement synthesis · 20 routines and logical pairs · no benchmark rerun</text>
  <text class="meta" x="50" y="139">integrated base c3afd5a1 · corrected measured heads carried below · 2026-08-09</text>

  <g transform="translate(50 163)">
    <rect width="198" height="42" rx="21" fill="#ccfbf1"/>
    <circle cx="22" cy="21" r="7" fill="#0f766e"/>
    <text class="count" x="39" y="29" fill="#0f766e">8</text>
    <text class="count-label" x="73" y="27" fill="#115e59">KEEP BOTH</text>
  </g>
  <g transform="translate(262 163)">
    <rect width="188" height="42" rx="21" fill="#dbeafe"/>
    <circle cx="22" cy="21" r="7" fill="#2563eb"/>
    <text class="count" x="39" y="29" fill="#2563eb">4</text>
    <text class="count-label" x="73" y="27" fill="#1d4ed8">COLLAPSE</text>
  </g>
  <g transform="translate(464 163)">
    <rect width="166" height="42" rx="21" fill="#ffe4e6"/>
    <circle cx="22" cy="21" r="7" fill="#be123c"/>
    <text class="count" x="39" y="29" fill="#be123c">4</text>
    <text class="count-label" x="73" y="27" fill="#9f1239">DELETE</text>
  </g>
  <g transform="translate(644 163)">
    <rect width="184" height="42" rx="21" fill="#fef3c7"/>
    <circle cx="22" cy="21" r="7" fill="#b45309"/>
    <text class="count" x="39" y="29" fill="#b45309">4</text>
    <text class="count-label" x="73" y="27" fill="#92400e">RELOCATE</text>
  </g>

