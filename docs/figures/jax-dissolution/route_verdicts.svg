      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#ffe4e6"/><text class="tag" x="66" y="14" fill="#be123c">DELETE</text></g>
      <text class="evidence" x="540" y="19">Delete zero-caller traced wrapper · retain 2-caller host class + live kernels · max Δ 3.12e−4</text>
