      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#ffe4e6"/><text class="tag" x="66" y="14" fill="#be123c">DELETE</text></g>
      <text class="evidence" x="540" y="19">0 traced callers · CPU 17.7–18.4× host · GPU 472–874× host</text>
    </g>
    <line x1="34" x2="1488" y1="179" y2="179" stroke="#edf1f7"/>
    <g transform="translate(0 185)">
      <text class="item" x="34" y="19">right and vector bisection</text>
      <g transform="translate(355 1)"><rect width="132" height="27" rx="13.5" fill="#ffe4e6"/><text class="tag" x="66" y="14" fill="#be123c">DELETE</text></g>
      <text class="evidence" x="540" y="19">0 traced callers · right route cannot trace · vector route fails on non-empty input</text>
