<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Active-set trip wall time and traced device work</title>
  <desc id="desc">Banked wall time is shown for the initial trip and six outer trips. Complete per-trip profiler sessions exist through solver trip five; CUDA failed during trip six.</desc>
  <rect width="900" height="520" fill="#fbfaf7"/>
  <text x="70" y="34" font-family="sans-serif" font-size="21" font-weight="700" fill="#1e293b">Dynamic work grows with active-set trip index</text>
  <text x="70" y="57" font-family="sans-serif" font-size="13" fill="#475569">MAST 22086/43 pure · job 1262787 partial trace · dashed region was not captured</text>
  <line x1="85" y1="450" x2="815" y2="450" stroke="#334155" stroke-width="1.5"/>
  <line x1="85" y1="75" x2="85" y2="450" stroke="#334155" stroke-width="1.5"/>
  <g font-family="sans-serif" font-size="12" fill="#475569">
    <text x="54" y="454">0</text><text x="47" y="364">3</text><text x="47" y="274">6</text><text x="47" y="184">9</text><text x="40" y="94">12</text>
    <text x="92" y="474">1</text><text x="192" y="474">2</text><text x="292" y="474">3</text><text x="392" y="474">4</text><text x="492" y="474">5</text><text x="592" y="474">6</text><text x="692" y="474">7</text>
    <text x="355" y="505" font-size="14">solver trip (initial + six outer trips)</text>
    <text transform="translate(20 320) rotate(-90)" font-size="14">seconds or scaled device work</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1">
    <line x1="85" y1="360" x2="815" y2="360"/><line x1="85" y1="270" x2="815" y2="270"/><line x1="85" y1="180" x2="815" y2="180"/><line x1="85" y1="90" x2="815" y2="90"/>
  </g>
  <rect x="550" y="75" width="165" height="375" fill="#ef4444" opacity="0.055" stroke="#ef4444" stroke-dasharray="6 5"/>
  <text x="568" y="110" font-family="sans-serif" font-size="12" fill="#991b1b">trace incomplete</text>
  <polyline points="100,438.6 200,348.9 300,348.7 400,335.3 500,281.7 600,84.4 700,82.9" fill="none" stroke="#0f172a" stroke-width="3"/>
  <polyline points="100,439.5 200,285.2 300,287.5 400,256.0 500,176.6" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="100,445.2 200,361.4 300,361.3 400,349.2 500,320.7" fill="none" stroke="#ea580c" stroke-width="3"/>
  <polyline points="100,444.2 200,377.9 300,378.7 400,368.1 500,323.1" fill="none" stroke="#16a34a" stroke-width="3"/>
  <g fill="#0f172a"><circle cx="100" cy="438.6" r="4"/><circle cx="200" cy="348.9" r="4"/><circle cx="300" cy="348.7" r="4"/><circle cx="400" cy="335.3" r="4"/><circle cx="500" cy="281.7" r="4"/><circle cx="600" cy="84.4" r="4"/><circle cx="700" cy="82.9" r="4"/></g>
  <g fill="#2563eb"><circle cx="100" cy="439.5" r="4"/><circle cx="200" cy="285.2" r="4"/><circle cx="300" cy="287.5" r="4"/><circle cx="400" cy="256.0" r="4"/><circle cx="500" cy="176.6" r="4"/></g>
  <g font-family="sans-serif" font-size="12" fill="#334155">
    <line x1="575" y1="370" x2="610" y2="370" stroke="#0f172a" stroke-width="3"/><text x="618" y="374">banked wall</text>
    <line x1="575" y1="392" x2="610" y2="392" stroke="#2563eb" stroke-width="3"/><text x="618" y="396">traced wall</text>
    <line x1="575" y1="414" x2="610" y2="414" stroke="#ea580c" stroke-width="3"/><text x="618" y="418">summed kernels</text>
    <line x1="575" y1="436" x2="610" y2="436" stroke="#16a34a" stroke-width="3"/><text x="618" y="440">between-launch gaps</text>
  </g>
</svg>
