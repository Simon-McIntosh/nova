<svg xmlns="http://www.w3.org/2000/svg" width="820" height="650" viewBox="0 0 820 650" role="img" aria-labelledby="title desc">
  <title id="title">Shape inverse regularisation trade-off</title>
  <desc id="desc">CPU linear closure fraction and maximum circuit current change across eight dimensionless Tikhonov weights for the upper-point and elongation commands.</desc>
  <rect width="820" height="650" fill="#ffffff"/>
  <text x="410" y="28" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="700">Shape inverse regularisation trade-off</text>
  <text x="410" y="47" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#4b5563">CPU, 20 kA per-circuit scale, source 78cf809c</text>

  <g font-family="sans-serif" font-size="11" fill="#374151" stroke="#d1d5db" stroke-width="1">
    <line x1="90" y1="260" x2="720" y2="260"/><line x1="90" y1="207.5" x2="720" y2="207.5"/>
    <line x1="90" y1="155" x2="720" y2="155"/><line x1="90" y1="102.5" x2="720" y2="102.5"/>
    <line x1="90" y1="50" x2="720" y2="50"/>
    <text x="78" y="264" text-anchor="end">0%</text><text x="78" y="211.5" text-anchor="end">25%</text>
    <text x="78" y="159" text-anchor="end">50%</text><text x="78" y="106.5" text-anchor="end">75%</text><text x="78" y="54" text-anchor="end">100%</text>
  </g>
  <line x1="90" y1="92" x2="720" y2="92" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="715" y="87" text-anchor="end" font-family="sans-serif" font-size="11" fill="#dc2626">80% admission floor</text>
  <text x="20" y="155" transform="rotate(-90 20 155)" text-anchor="middle" font-family="sans-serif" font-size="13">Rows closing at least 80%</text>
  <polyline points="90,114.8 180,111.9 270,111.6 360,108.3 450,107.0 540,128.4 630,215.4 720,209.3" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="90,212.3 180,212.3 270,117.3 360,149.6 450,145.0 540,150.8 630,161.8 720,142.5" fill="none" stroke="#d97706" stroke-width="3"/>
  <g fill="#2563eb"><circle cx="90" cy="114.8" r="4"/><circle cx="180" cy="111.9" r="4"/><circle cx="270" cy="111.6" r="4"/><circle cx="360" cy="108.3" r="4"/><circle cx="450" cy="107" r="4"/><circle cx="540" cy="128.4" r="4"/><circle cx="630" cy="215.4" r="4"/><circle cx="720" cy="209.3" r="4"/></g>
  <g fill="#d97706"><circle cx="90" cy="212.3" r="4"/><circle cx="180" cy="212.3" r="4"/><circle cx="270" cy="117.3" r="4"/><circle cx="360" cy="149.6" r="4"/><circle cx="450" cy="145" r="4"/><circle cx="540" cy="150.8" r="4"/><circle cx="630" cy="161.8" r="4"/><circle cx="720" cy="142.5" r="4"/></g>

  <g font-family="sans-serif" font-size="11" fill="#374151" stroke="#d1d5db" stroke-width="1">
    <line x1="90" y1="560" x2="720" y2="560"/><line x1="90" y1="507.5" x2="720" y2="507.5"/>
    <line x1="90" y1="455" x2="720" y2="455"/><line x1="90" y1="402.5" x2="720" y2="402.5"/><line x1="90" y1="350" x2="720" y2="350"/>
    <text x="78" y="564" text-anchor="end">1 kA</text><text x="78" y="511.5" text-anchor="end">10 kA</text>
    <text x="78" y="459" text-anchor="end">100 kA</text><text x="78" y="406.5" text-anchor="end">1 MA</text><text x="78" y="354" text-anchor="end">10 MA</text>
  </g>
  <line x1="90" y1="491.7" x2="720" y2="491.7" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="715" y="486" text-anchor="end" font-family="sans-serif" font-size="11" fill="#15803d">20 kA ceiling</text>
  <text x="20" y="455" transform="rotate(-90 20 455)" text-anchor="middle" font-family="sans-serif" font-size="13">Maximum |circuit change| (log scale)</text>
  <polyline points="90,387.7 180,387.6 270,390.7 360,406.8 450,431.8 540,441.7 630,477.2 720,513.7" fill="none" stroke="#2563eb" stroke-width="3"/>
  <polyline points="90,355.5 180,355.6 270,405.5 360,390.6 450,452.7 540,436.1 630,462.2 720,497.8" fill="none" stroke="#d97706" stroke-width="3"/>
  <g fill="#2563eb"><circle cx="90" cy="387.7" r="4"/><circle cx="180" cy="387.6" r="4"/><circle cx="270" cy="390.7" r="4"/><circle cx="360" cy="406.8" r="4"/><circle cx="450" cy="431.8" r="4"/><circle cx="540" cy="441.7" r="4"/><circle cx="630" cy="477.2" r="4"/><circle cx="720" cy="513.7" r="4"/></g>
  <g fill="#d97706"><circle cx="90" cy="355.5" r="4"/><circle cx="180" cy="355.6" r="4"/><circle cx="270" cy="405.5" r="4"/><circle cx="360" cy="390.6" r="4"/><circle cx="450" cy="452.7" r="4"/><circle cx="540" cy="436.1" r="4"/><circle cx="630" cy="462.2" r="4"/><circle cx="720" cy="497.8" r="4"/></g>

  <g font-family="sans-serif" font-size="10" fill="#374151">
    <text x="90" y="585" text-anchor="middle">0</text><text x="180" y="585" text-anchor="middle">1e-4</text><text x="270" y="585" text-anchor="middle">1e-3</text><text x="360" y="585" text-anchor="middle">1e-2</text><text x="450" y="585" text-anchor="middle">1e-1</text><text x="540" y="585" text-anchor="middle">1</text><text x="630" y="585" text-anchor="middle">10</text><text x="720" y="585" text-anchor="middle">100</text>
    <text x="405" y="610" text-anchor="middle" font-size="13">Dimensionless Tikhonov weight λ</text>
  </g>
  <g font-family="sans-serif" font-size="12">
    <line x1="255" y1="630" x2="285" y2="630" stroke="#2563eb" stroke-width="3"/><text x="292" y="634">upper +20 mm</text>
    <line x1="440" y1="630" x2="470" y2="630" stroke="#d97706" stroke-width="3"/><text x="477" y="634">elongation +5%</text>
  </g>
</svg>
