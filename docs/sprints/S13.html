  <li data-slug="scoring-criteria-derivation" data-item="{&quot;done_when&quot;: &quot;A criterion independent of the quantity it tests is derived and stated as a formula with per-reference values; the six MAST references are re-scored beside the retained 1e-8 count; the circular estimator is excluded with its algebra shown; the digest pin is replaced by a semantic identity; and each bound is stated as supported, merely contained, or reclassified.&quot;, &quot;slug&quot;: &quot;scoring-criteria-derivation&quot;, &quot;why_now&quot;: &quot;The forward-parity verdicts and a held GPU catalog are all scored against bounds traced to inherited solver defaults and an unreachable digest pin, and the first replacement attempt was algebraically circular. Until a criterion is derived independently of the residual it judges, no reliability figure on this lane means what it appears to mean.&quot;}">scoring-criteria-derivation</li>
  <li data-slug="test-lane-marker-policy" data-item="{&quot;done_when&quot;: &quot;The plain per-file invocation selects its 28 tests with the count quoted, or a documented default marker expression makes it do so; the policy is stated once in the repository test guidance; and a zero-collected run exits non-zero, demonstrated on a case that previously exited 0.&quot;, &quot;slug&quot;: &quot;test-lane-marker-policy&quot;, &quot;why_now&quot;: &quot;The forward-solve suite collects 0 of 28 tests and exits 0 unless given a marker override, so the invocation any agent, contributor or CI step reaches for reports a false green. It surfaced only because one worker counted collected tests; the repository should not depend on that.&quot;}">test-lane-marker-policy</li>
  <li data-slug="forward-operator-refinement" data-item="{&quot;done_when&quot;: &quot;The default interior resolution is raised to at least the reference-native equivalent with its measured coupling and build cost stated and the forward suites green at the new default; the operator order is raised on a stated scheme with the observed order re-measured, the two order strata reported separately, and the build-compute independence from mesh demonstrated; and the result states whether raising order moves the floors that mesh refinement moved, judged against a criterion from scoring-criteria-derivation rather than the inherited bound.&quot;, &quot;slug&quot;: &quot;forward-operator-refinement&quot;, &quot;why_now&quot;: &quot;The owner directed on 2026-08-23 that plasma-cell-resolution refinement and operator scaling be sequenced in the solver lane and landed, with the DIII-D forward gate re-evaluation held behind it. Until today that directive was tracked only as a followup pointer on a parity plan and as a handoff on a shipped one, so it had no home that the roadmap would surface. Its resolution half is also the cheapest correction available anywhere in the campaign: the default sits 8.6x coarser than the reference it is scored against, and matching it costs 0.44 GB of coupling.&quot;}">forward-operator-refinement</li>
  </ol>
  <script type="application/json" id="reckon-resource-state">{"description":"The parity campaign closed its physics questions and left an instrument question behind: the criteria its verdicts were scored against. Tracing them found the fixed-point bound to be an inherited solver stopping tolerance with no physical referent, two geometry bounds pinned to an artifact digest that has since moved, and a forward suite that reports a false green when invoked without its marker override. None is a physics defect and all three change what earlier verdicts mean, so they are grouped as one sprint rather than scattered as caveats. The purpose is to replace inherited bounds with derived ones, or to state plainly that a bound cannot be derived and reclassify it. The mesh-versus-operator question rides alongside: mesh refinement is quadratic in interaction-matrix build compute while raising operator order costs nothing to rebuild, so frontier work is sequenced behind a criterion that can tell convergence from precision without accuracy.","ends":"2026-09-20","id":"S13","items":[{"done_when":"A criterion independent of the quantity it tests is derived and stated as a formula with per-reference values; the six MAST references are re-scored beside the retained 1e-8 count; the circular estimator is excluded with its algebra shown; the digest pin is replaced by a semantic identity; and each bound is stated as supported, merely contained, or reclassified.","slug":"scoring-criteria-derivation","why_now":"The forward-parity verdicts and a held GPU catalog are all scored against bounds traced to inherited solver defaults and an unreachable digest pin, and the first replacement attempt was algebraically circular. Until a criterion is derived independently of the residual it judges, no reliability figure on this lane means what it appears to mean."},{"done_when":"The plain per-file invocation selects its 28 tests with the count quoted, or a documented default marker expression makes it do so
