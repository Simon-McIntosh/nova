  <li data-slug="mast-catalog-gpu-solve" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;H200 solve meets science, provenance and throughput gates; versioned label store and optional IMAS egress are published.&quot;, &quot;slug&quot;: &quot;mast-catalog-gpu-solve&quot;, &quot;why_now&quot;: &quot;The validated production substrate is ready for campaign-scale GPU execution and label-store release.&quot;}">mast-catalog-gpu-solve</li>
  <li data-slug="plateau-input-attribution" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;context&quot;: &quot;extended&quot;, &quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;elevated&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Each of the four documented substitutions carries a per-frame verdict on the five score-blind frames - MOVES_THE_PLATEAU with the residual reached quoted against that frame&#x27;s value in conditioning-repair.json, or NOT_IMPLICATED with the explored range stated - the receipt names the substitution accounting for the largest share of the gap, and the converged frame 22086/43 is placed against the five plateauing frames on every substitution measured with the differing values quoted or the compared properties named as not separating them.&quot;, &quot;slug&quot;: &quot;plateau-input-attribution&quot;, &quot;why_now&quot;: &quot;Existence is settled twice over and re-asking it would waste a sprint: the corpus is EFIT reconstructions of physical diverted DIII-D discharges, so the continuum problem with the true wall, currents and profiles has a diverted solution, and frame 22086/43 in the same corpus family already solves to 2.9e-16 on the shipped operator. So a solve stalling at 0.087 to 0.155 is solving a different problem, and four substitutions between the two are documented rather than hypothetical - a pseudo-wall rectangle standing in for the absent machine wall AND serving as the surface the refusing topology predicate reads, three unknown-tier ohmic conductor currents, flux functions differentiated out of a reconstructed map behind a reliability mask, and a default discretisation measured 8.6x coarser than its reference. The magnetic axis lands a mean 164.6 mm from the reconstruction&#x27;s, which is tens of percent of a minor radius and not an iteration budget.&quot;}">plateau-input-attribution</li>
  <li data-slug="same-device-label-determinism" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;context&quot;: &quot;extended&quot;, &quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;elevated&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;Each of the six held-out cases carries STATE_REPRODUCIBLE or STATE_VARIES across at least three repetitions in one allocation, with the maximum bitwise-unequal element count and the maximum absolute and relative terminal-flux difference quoted alongside the same figures per registered observable; the nondeterministic operation is named and its control applied; three consecutive acceptance-driver runs in one allocation return identical bound counts, identical case counts and identical per-case verdicts; and the control&#x27;s throughput cost is quoted as a per-slice figure against the unconstrained route.&quot;, &quot;slug&quot;: &quot;same-device-label-determinism&quot;, &quot;why_now&quot;: &quot;Two back-to-back invocations of one driver on one H200, on byte-identical inputs and the same seed, returned different registered-bound verdicts - bound totals moved at both batch widths and ten individual case verdicts flipped, with conservation.divergence_b failing both widths in one run and passing both in the next. The fixed-reduction repair that was expected to explain it improved the counts and left the movement intact, so the cause is not the moment reduction association. Until a route agrees with itself on a rerun, no acceptance check the throughput ladder invokes certifies anything, because the verdict is a sample rather than a value.&quot;}">same-device-label-determinism</li>
  <li data-slug="coefficient-space-newton" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;context&quot;: &quot;extended&quot;, &quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;elevated&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;All four arms of the solution matrix are measured on a common frame set at one source revision - exact-value and coefficient-carrier iterates crossed with first and second order in-cell current support - each scored against the shipped baseline on convergence, speed and accuracy, with the interaction between the two levers stated explicitly and any trade reported as a trade; the exact-value route is demonstrated to remain selectable at the call site rather than replaced; and the matrix is benchmarked on the reserved H200 with a batchability assessment across up to six cards quoting per-card scaling, the one-time build separated from the per-slice execute, and the throughput against the banked 46.577604167 slices per second per device.&quot;, &quot;slug&quot;: &quot;coefficient-space-newton&quot;, &quot;why_now&quot;: &quot;The campaign has built and refuted three stepping mechanisms on a ten-thousand-dimensional flux iterate whose projected Krylov condition reaches 4087, and the representation degree of the thing being solved for is now measured: 16 coefficients for the closed-form carriers and 36 for the stored ones already beat the hardest banked production residual in closed-flux error, against 551 to 1076 plasma cells. At that size the Jacobian can be formed explicitly and solved directly, which retires Arnoldi, GMRES, the projected condition number, step conditioning and non-normal amplification from the path at once. The second-order cell support that pairs with it is buildable, verified and priced at 2.0x memory against the 13.6x that mesh refinement charges.&quot;}">coefficient-space-newton</li>
  <li data-slug="curved-clip-global-surface" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;elevated&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;The curved clip is re-measured with its curve taken from the global tensor spline rather than any per-cell reconstruction, gated on a real low-aspect-ratio equilibrium rather than the analytic oracle: STEP clipped-to-contour vpr and g1 quoted against the banked 16.46 and 18.14 per cent and 9.78 and 22.31 per cent against their 3.92 and 6.20 per cent gates; the four ITER coefficients against the banked 2.63, 0.90, 2.08 and 1.98 per cent; clipped-to-contour and clipped-to-TORAX agreement quoted beside the contour-to-TORAX baseline of 0.16 to 6.20 per cent so the outlier question is answered directly; and an explicit statement of whether the global-surface curve closes the gap the local reconstructions opened, with the fixed-shape padded capacities preserved rather than widened.&quot;, &quot;slug&quot;: &quot;curved-clip-global-surface&quot;, &quot;why_now&quot;: &quot;Curved sagitta clips are already built and validated - a chord-to-hyperbola closed form at 1.57e-5 against a subcell raster, and a bicubic route with Green-theorem arc moments whose extremum converges at fourth order to six figures - and both were refuted on real spherical-tokamak fields for one architectural reason: the curve came from a LOCAL per-cell reconstruction that converges to a different surface than the reference readers use. The prescription left behind was to take the curve from the global C2 tensor B-spline instead. That spline landed on 2026-08-21 at commit 75e33479, so the named precondition is now satisfied and a twice-refuted question is retestable rather than closed. It needs its own plan because the module owner is shipped at implementation 1.0 and cannot carry work, while the plan supplying the surface is fenced out of writing the clip.&quot;}">curved-clip-global-surface</li>
  <li data-slug="discrete-operator-analytic-error" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;context&quot;: &quot;extended&quot;, &quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;elevated&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;The residue is attributed to posing or to the operator by measurement rather than by audit: a refinement ladder of at least four resolutions reports the fitted convergence order of the analytic error with its uncertainty so a constant offset is distinguished from a converging one; the one-application residual of the exact map at the analytic solution is quoted in absolute flux and by region against the terminal residual the solve reaches on its own fixed point; the external, boundary and source terms the analytic case is posed with are each quoted against what the closed form specifies; and a named verdict is recorded, with a posing verdict reported as the better outcome rather than the lesser one.&quot;, &quot;slug&quot;: &quot;discrete-operator-analytic-error&quot;, &quot;why_now&quot;: &quot;A node measuring the coefficient carrier found both forward arms converging to machine precision on their own discrete fixed points while sitting 26 to 45 per cent from a closed-form solution, and the follow-up measurement exonerated the two cheap explanations: the comparison lane reproduced the banked scores exactly at delta zero, and a field-owned common gauge reduced the error only to 19 to 38 per cent, still exceeding the preregistered gauge-only floor by eleven orders and leaving 0.42 to 0.74 Wb in absolute flux. The anchors localise it - a boundary a closed form puts at zero to rounding sits at -0.246 Wb - and coarse and fine agree to three or four digits, so refinement does not move it. Every parity and accuracy claim that scores the forward map against a reference inherits this residue, which is wider than the plan that found it.&quot;}">discrete-operator-analytic-error</li>

  <li data-slug="primary-xpoint-evidence" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;general&quot;, &quot;requirements&quot;: {&quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;A batched test asserts primary X-point coordinates and flux against per-slice reads on fixtures including double-null and near-tangency cases; margin receipts serialize the selected X candidate and its operands, verified by regenerating one banked terminal receipt with zero differing numeric fields in existing entries; and the isolated connectivity transform test self-configures the x64 policy and passes alone.&quot;, &quot;slug&quot;: &quot;primary-xpoint-evidence&quot;, &quot;why_now&quot;: &quot;Catalog-scale class decisions are about to route through a primary X-point identification whose spatial correctness is currently proven only against the Boolean comparator it checks: the capability audit measured 10 of 10 terminal and 53 of 53 fixture agreement with no serialized coordinate, flux operand, or candidate table anywhere. The three closures are small, independently shippable, and none alters production behaviour.&quot;}">primary-xpoint-evidence</li>

tory's first machine-precision diverted terminal - so branch asymmetry is quantitative, not existential. The operator was exonerated first: one application of the exact map at the analytic solution returns machine precision with every posed term matching, so the residue is which fixed point the solver reaches. What replaces the existence question is narrower and belongs to the Newton PROMOTION POLICY rather than to the map, whose spectral radius exceeds one at both references: why a 1.75x terminal conditioning gap, 36.785 cycling against 21.040 converging, separates quadratic convergence from a permanent two-value alternation. Two lead decisions gate the rest. The fork policy has both its numbers - forking costs 1.22x single at batch 16, not 2x, which favours always-fork - but its armed fraction cannot be measured on catalog frames until the catalog is solved, and this plan blocks that solve. And a fixed ten-step Newton-Krylov budget does not recover cold seeds over a full root span away, which is a solver-contract question rather than a test detail. The primary branch carries two deliberately visible failures documenting that limitation.","theme":"Reach the root, then run the catalog","type":"sprint","version":4}</script>
