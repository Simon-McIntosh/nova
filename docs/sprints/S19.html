d defect class, so two plans join the sprint: null-identification-authority and diiid-vertical-force-balance, both blocking gs-absolute-accuracy-gates. Order for the next session: dispatch the pre-settlement prototype (solver-convergence-regression section 4) and its Solovev and MAST measurements; null-identification-authority sections 1, 2 and 4; solve-default-wiring items 3, 1, 4, 5, 6 then its test; diiid-vertical-force-balance; forward-solve-api section 5 (raster receipt, warm start, bitwise) then sections 1 to 4; gs-absolute-accuracy-gates section 3; batched-operator-boundary; millisecond-converged-solve. Handoff: docs/research/convergence-stall-handoff.html plus the triage reports under ~/.config/reckon/crew/reports/nova/triage/.","ends":"","id":"S19","items":[{"done_when":"The true-pin reproduction, HEAD mechanism and root-cause receipts are landed and collapsed, pre-settlement incumbent scoring is the merged production default, the bank re-baselines at machine precision, and the finite axisless vacuum map and exact-certificate rebase are recorded as followups owned by null-identification-authority.","effort":"M","roi":"high","slug":"solver-convergence-regression","title":"Explain the backend margin","why_now":"Trust prerequisite for every accuracy claim on marginal diverted arms; the forensics, mechanism and acceptance repair are landed and only the record needs closing."},{"done_when":"The residual-progress-exit-window decision is closed by the lead on its banked census numbers and the plan ships with its receipts collapsed.","effort":"S","roi":"high","slug":"solver-trip-orchestration","title":"Close the exit-window decision","why_now":"All three investigation receipts and the strict-exit implementation are landed; only the policy lock remains."},{"done_when":"A receipt names the dominant CPU cost with its measured share, states whether a HEAD-versus-a4bec44f CPU pair recovers the 38-minute solve, and the pathology is either fixed with the referee tests gre
