<main class="reckon-resource" data-type="sprint" data-id="S23">
  <ol data-reckon="sprint-items">
  <li data-slug="dual-branch-selection" data-item="{&quot;capability&quot;: {&quot;class&quot;: &quot;orchestrator&quot;, &quot;requirements&quot;: {&quot;context&quot;: &quot;extended&quot;, &quot;reasoning&quot;: &quot;deep&quot;, &quot;risk&quot;: &quot;elevated&quot;, &quot;verification&quot;: &quot;strict&quot;}, &quot;version&quot;: &quot;1.0&quot;}, &quot;done_when&quot;: &quot;The selection seam is a production traced API reproducing the prototype&#x27;s 53 of 53 exact-class agreement and dense-rail continuity, with the degrade-path count reported per cohort so an all-degrade cohort reads as untested rather than as success; the three host islands - array-only seed construction, integer-array selector state under lax.scan, fixed-ladder bootstrap - are closed under jit and an outer vmap; and the fork-arming policy is locked from a measured armed fraction on catalog frames together with the measured two-branch batch cost, never from either number alone.&quot;, &quot;slug&quot;: &quot;dual-branch-selection&quot;, &quot;why_now&quot;: &quot;The sprint&#x27;s blocking finding is measured: the solver reaches limiter-class roots on every diverted request - 0 of 10 under the mixed margin-penalty iteration, and branch-pure pinned stalls at 4.6e-3 to 7.4e-3 - while the operator is exonerated at roundoff. The prior-art map shows the mature reference implementation solved this exact ambiguity with identical-seed branch-pure solves and selection after solves, and that its hard selector cannot meet the traced-continuity requirement, so the continuous selector is the one genuinely novel object. The differentiable observable p_diverted already ships jitted and batched, and the seam prototype landed passing: 53 of 53 exact-class agreement, continuous on both 257-point rails, degrade semantics exact.&quot;}">dual-branch-selection</li>
  <li data-slug="playable-forward-solve" data-item="{&quot;done_when&quot;: &quot;The labeller is the deliverable: a fresh current-HEAD batched corpus receipt with nonzero converged counts, exact batched-versus-reference fraction parity, every selected shot&#x27;s session and manifest written once with conditioning provenance, and the demo-era followups repointed to their owning plans; the stood-down interactive demo is not a completion predicate.&quot;, &quot;effort&quot;: &quot;L&quot;, &quot;roi&quot;: &quot;high&quot;, &quot;slug&quot;: &quot;playable-forward-solve&quot;, &quot;title&quot;: &quot;The forward solve as a labeller&quot;, &quot;why_now&quot;: &quot;Lead 2026-09-07: the demo stands down, the labeller is the work; the physics backbone for the MAST video decoder.&quot;}">playable-forward-solve</li>
  <li data-slug="centroid-constrained-oracle-solve" data-item="{&quot;done_when&quot;: &quot;A compensating exterior-field unknown exists on the fixture, the centroid row is imposed through the machine interface, all four analytic rows at 110, 300 and 1000 cells converge to the oracle-near fixed point within ten times the 1.1e-4 span floor with the compensating amplitude tabled and falling with cell count, and the whole-cell rows move to the oracle centroid while keeping their booking error as the negative control.&quot;, &quot;effort&quot;: &quot;M&quot;, &quot;roi&quot;: &quot;high&quot;, &quot;slug&quot;: &quot;centroid-constrained-oracle-solve&quot;, &quot;title&quot;: &quot;Constrain the centroid so the certificate cannot fall into the displaced basin&quot;, &quot;why_now&quot;: &quot;Lead 2026-09-16: the Solovev fixture exterior has no positional stiffness, so the production map has a displaced second fixed point the seed selects on five of six exact-clip rows; a Newton-Krylov centroid row removes the basin problem without re-posing the oracle.&quot;}">centroid-constrained-oracle-solve</li>
  <li data-slug="uniform-cell-clip-and-coupling" data-item="{&quot;done_when&quot;: &quot;The outboard off-axis singularity is found and repaired with the six certificate residuals before and after, one clip and moment path serves hex and rectangular tilings at matched order, accuracy and wall with no mesh-type branch in the lowered program, and the affine flux-function round trip runs on Nova&#x27;s own forward solution to the operator floor.&quot;, &quot;effort&quot;: &quot;M&quot;, &quot;roi&quot;: &quot;high&quot;, &quot;slug&quot;: &quot;uniform-cell-clip-and-coupling&quot;, &quot;title&quot;: &quot;One clip and one coupling operator over both tilings&quot;, &quot;why_now&quot;: &quot;Lead direction 2026-09-08: three S19 nodes hit the hex/rectangular seam in one day and two lead questions are unanswerable until one clip and one moment path serve both tilings; the outboard Solovev error patch is its first work item.&quot;}">uniform-cell-clip-and-coupling</li>
  <li data-slug="topology-read-containment-and-rebank" data-item="{&quot;done_when&quot;: &quot;The class-free read publishes the axis-enclosing contact and classifies limited on the row 16 fixture; the twelve-row MAST bank and the sixteen-row certificate are regenerated on a named main revision with deltas recorded; the saddle detector admits the single-null X-point at 110, 300 and 500 cells; the certificate drift is attributed per commit and the 300-cell NaN repaired; every receipt carries the joint qualification verdict.&quot;, &quot;effort&quot;: &quot;L&quot;, &quot;roi&quot;: &quot;high&quot;, &quot;slug&quot;: &quot;topology-read-containment-and-rebank&quot;, &quot;title&quot;: &quot;Topology read containment and rebank&quot;, &quot;why_now&quot;: &quot;The lead&#x27;s binary class rule is met on the class-pinned read only, and every accuracy gate compares against a bank that does not describe main; gs-absolute-accuracy-gates is blocked on this.&quot;}">topology-read-containment-and-rebank</li>
  <li data-slug="labeller-throughput-and-shape-inverse" data-item="{&quot;done_when&quot;: &quot;One compiled program per slice and a batched device read reach the lead&#x27;s 300 slices a second target with bit-identical labels; the elongation command achieves its motion within 5 percent under an outer Newton loop; the multi-trip constrained iteration is proven over three to four caps; the cold first iterate is shadowed; the decoder corpus is written as one sharded job.&quot;, &quot;effort&quot;: &quot;XL&quot;, &quot;roi&quot;: &quot;high&quot;, &quot;slug&quot;: &quot;labeller-throughput-and-shape-inverse&quot;, &quot;title&quot;: &quot;Labeller throughput and shape inverse&quot;, &quot;why_now&quot;: &quot;Playable-forward-solve is a record at 0.995 and its tail held the throughput and shape-inverse work the imas-ambix decoder depends on; those need the H200 and are gated on reservation headroom.&quot;}">labeller-throughput-and-shape-inverse</li>
  <li data-slug="shafranov-observed-side" data-item="{&quot;done_when&quot;: &quot;Production operators carry the field response blocks built at operator build with a two-solve reuse test and a committed kernel counter; the grid route&#x27;s fitted order is stated with its mechanism; the constraint&#x27;s observed side is the contour integral with the toroidal term&#x27;s source ruled and recorded; the six-row receipt is regenerated on it.&quot;, &quot;effort&quot;: &quot;M&quot;, &quot;roi&quot;: &quot;high&quot;, &quot;slug&quot;: &quot;shafranov-observed-side&quot;, &quot;title&quot;: &quot;Shafranov observed side&quot;, &quot;why_now&quot;: &quot;The lead ruled the observed side is an exact integral on the exact Biot field; the machinery landed but nothing in production constructs it and the constraint row still embeds the formula.&quot;}">shafranov-observed-side</li>
  </ol>
