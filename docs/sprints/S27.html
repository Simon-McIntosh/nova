  <script type="application/json" id="reckon-resource-state">{"description":"Opened 2026-10-06 on the lead's instruction after S22 closed. Worktrees are always removed once a run is promoted, so no committed artifact may name a path inside one. This sprint rewrites the 1,146 committed files that do and adds a test and a check-only pre-commit hook so no new one can land. It does not touch solver code or measured values, and it runs beside S21 without contending for S21's files: every path S21's live runs claim is excluded at dispatch. LANES: mechanical, exactly specified nodes on the local lane.","ends":"2026-10-06","id":"S27","items":[{"done_when":"No tracked file outside docs/state, docs/plans and docs/research contains a worktree path; launch scripts resolve their repository root at run time; a fast test and a check-only pre-commit hook reject any new worktree path, each with a logged negative control.","slug":"artifacts-carry-no-worktree-paths","why_now":"Lead 2026-10-06: worktrees will always be removed, so 1,146 committed artifacts already point at paths that are gone or about to go, and nothing stops a worker from adding more."}],"starts":"2026-10-06","status":"done","summary":"Closed 2026-10-06. artifacts-carry-no-worktree-paths shipped. One lexical rule in nova.database.filepath rewrote 1,079 committed data files to repository-relative paths. 62 launch scripts resolve their root at run time. The binary cProfile dump and its two producers are relativized, and two benchmark roots that pointed into removed worktrees are now required arguments. On origin, binary files included, only the exempt rule module names the worktree root. tests/test_artifacts_carry_no_worktree_paths.py (4 s) and the read-only scripts/git-hooks/pre-commit share one candidate search and one predicate. The hook is enabled through core.hooksPath and documented in AGENTS.md. It refused every linked-worktree commit until the e8655e6f5 repair; core.hooksPath was unset while that was fixed. Outside this sprint: the receipts-out-of-git size ceiling joins the hook in nova-fd's migration node, and reckon has been asked to name the relativizing step in its worker contract.","theme":"Artifacts that outlive their worktrees","type":"sprint","version":3}</script>
