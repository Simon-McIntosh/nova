version: 1

# The project's own standing suite: every collected test file in its own
# pytest process, with the files whose measured CPU wall exceeds ten minutes
# routed to the H200 lane. The runner (reckon/crew/standing_suite.py) executes
# this one command from the checkout root under the whole-run budget below,
# kills the whole process group at it, and reads the combined log's
# pytest-style summary line.
review:
  suite:
    command:
      - bash
      - scripts/nova_lane/standing_suite.sh
    budget: 3h
# The paired suite each worker runs at its base and at its head, scoped to the
# node's own test files. The lander lands a complete, reviewed run only when
# the head arm adds no failure over the base arm. The interpreter is named
# directly because compute nodes cannot invoke uv, and the CPU pin makes both
# arms the same numerical measurement wherever they run.
gates:
  suite_command: "PYTHONPATH=. JAX_PLATFORMS=cpu /home/ITER/mcintos/Code/nova/.venv/bin/python -m pytest -p no:cacheprovider -q {node_test_files}"
