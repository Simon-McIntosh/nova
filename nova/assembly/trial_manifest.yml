# Trial simulation manifest
# Named parameter sets for Monte Carlo simulations
#
# Structure:
#   - defaults: Fixed parameters for each trial type (used in hash computation)
#   - simulations: Named parameter sets with variable theta/samples
#
# The cache hash is computed at runtime by Trial.group_name from:
#   attrs.values() + theta + pdf
# where attrs includes: samples, adjust_gap, max_nominal_gap, sead
# plus class-specific fields: modes, energize, wall (Vault only)

defaults:
  vault:
    components: [radial, tangential, roll_length, yaw_length, radial_ccl, tangential_ccl, radial_wall]
    pdf: [uniform, uniform, uniform, uniform, normal, normal, uniform]
    adjust_gap: true
    max_nominal_gap: 2.0
    sead: 2025
    modes: 3
    energize: 1
    wall: 1
  error_field:
    components: [radial, tangential, vertical, radial_ccl, tangential_ccl, vertical_ccl, pitch_length, roll_length, yaw_length]
    pdf: [uniform, uniform, uniform, normal, normal, normal, uniform, uniform, uniform]
    adjust_gap: true
    max_nominal_gap: 2.0
    sead: 2025

simulations:
  # ==========================================================================
  # Historical simulations (2021) - original tolerancing analysis
  # ==========================================================================

  baseline_2021:
    description: "Original ITER TF coil tolerancing analysis - baseline assumptions"
    date: "2021-01-01"
    vault:
      samples: 200000
      theta: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 3.0]
    error_field:
      samples: 2000000
      theta: [1.5, 1.5, 3.0, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]

  wide_tolerances_2021:
    description: "Wide tolerance study - from commented parameters"
    date: "2021-01-01"
    vault:
      samples: 100000
      theta: [1.5, 1.5, 3.0, 3.0, 2.0, 2.0, 5.0]
    error_field:
      samples: 2000000
      theta: [5.0, 5.0, 5.0, 2.0, 2.0, 2.0, 5.0, 10.0, 10.0]

  # From commented parameters: uniform 3mm for all
  uniform_3mm:
    description: "Uniform 3mm tolerance study - from commented parameters"
    date: null
    error_field:
      samples: 2000000
      theta: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0]

  # ==========================================================================
  # Hybrid simulations (2026) - updated from pit measurements
  # ==========================================================================

  # Updated tolerance windows based on L_upper_18 from measured data
  # All coils sampled, but with tighter tolerances where data supports it
  S4_refine_pit_2026:
    description: "Updated tolerances from L_upper_18 of installed sectors (Jan 2026)"
    date: "2026-01-11"
    # Shared theta values - code extracts relevant subset per trial type
    theta:
      radial: 1.3
      tangential: 1.0
      vertical: 1.5
      radial_ccl: 1.5
      tangential_ccl: 1.5
      vertical_ccl: 1.5
      pitch_length: 0.6
      roll_length: 0.4
      yaw_length: 1.2
      radial_wall: 3.0
    vault:
      samples: 200000
    error_field:
      samples: 2000000

  # Hybrid trial: measured positions for installed sectors, sampled for rest
  # measured_sectors field specifies which sectors use pit measurements
  S4_hybrid_pit_2026:
    description: "Measured positions for S5-8, sampled for remaining coils"
    date: "2026-01-11"
    # Shared theta values - same as S4_refine_pit_2026
    theta:
      radial: 1.3
      tangential: 1.0
      vertical: 1.5
      radial_ccl: 1.5
      tangential_ccl: 1.5
      vertical_ccl: 1.5
      pitch_length: 0.6
      roll_length: 0.4
      yaw_length: 1.2
      radial_wall: 3.0
    vault:
      samples: 200000
      measured_sectors: [5, 6, 7, 8]
    error_field:
      samples: 2000000
      measured_sectors: [5, 6, 7, 8]
