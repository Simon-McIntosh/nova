# Trial simulation manifest
# Links simulation parameters to cached results via hash
#
# Each entry contains:
#   - description: Human-readable description
#   - date: Date simulation was run (null if unknown)
#   - vault: Vault trial parameters (structural/gap analysis)
#   - error_field: ErrorField trial parameters (magnetic error field)
#
# The hash is computed from input parameters and cannot be set manually.
# Use labels to recall simulations by name.

simulations:
  # ==========================================================================
  # Historical simulations recovered from code comments
  # ==========================================================================

  baseline_2021:
    description: "Original ITER TF coil tolerancing analysis - baseline assumptions"
    date: "2021-01-01"
    vault:
      samples: 100000
      theta: [1.5, 1.5, 3.0, 3.0, 2.0, 2.0, 5.0]
      components: [radial, tangential, roll_length, yaw_length, radial_ccl, tangential_ccl, radial_wall]
      pdf: [uniform, uniform, uniform, uniform, normal, normal, uniform]
      adjust_gap: true
      max_nominal_gap: 2.0
    error_field:
      samples: 2000000
      theta: [5.0, 5.0, 5.0, 2.0, 2.0, 2.0, 5.0, 10.0, 10.0]
      components: [radial, tangential, vertical, radial_ccl, tangential_ccl, vertical_ccl, pitch_length, roll_length, yaw_length]
      pdf: [uniform, uniform, uniform, normal, normal, normal, uniform, uniform, uniform]

  # Historical variant from comments: theta = [5, 5, 5, 10, 2, 2, 2.5]
  wide_tolerances:
    description: "Wide tolerance study - from commented parameters"
    date: null
    vault:
      samples: 100000
      theta: [5.0, 5.0, 5.0, 10.0, 2.0, 2.0, 2.5]
      components: [radial, tangential, roll_length, yaw_length, radial_ccl, tangential_ccl, radial_wall]
      pdf: [uniform, uniform, uniform, uniform, normal, normal, uniform]
      adjust_gap: true
      max_nominal_gap: 2.0

  # ==========================================================================
  # Current simulations (2026)
  # ==========================================================================

  tight_tolerances_2026:
    description: "Updated tolerances based on pit measurements - all 1.5mm except vertical 3.0mm"
    date: "2026-01-11"
    vault:
      samples: 200000
      theta: [1.5, 1.5, 1.5, 1.5, 1.5, 1.5, 3.0]
      components: [radial, tangential, roll_length, yaw_length, radial_ccl, tangential_ccl, radial_wall]
      pdf: [uniform, uniform, uniform, uniform, normal, normal, uniform]
      adjust_gap: true
      max_nominal_gap: 2.0
    error_field:
      samples: 2000000
      theta: [1.5, 1.5, 3.0, 1.5, 1.5, 1.5, 1.5, 1.5, 1.5]
      components: [radial, tangential, vertical, radial_ccl, tangential_ccl, vertical_ccl, pitch_length, roll_length, yaw_length]
      pdf: [uniform, uniform, uniform, normal, normal, normal, uniform, uniform, uniform]

  # Historical variant: uniform 3mm for all components
  uniform_3mm:
    description: "Uniform 3mm tolerance study - from commented parameters"
    date: null
    error_field:
      samples: 2000000
      theta: [3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0, 3.0]
      components: [radial, tangential, vertical, radial_ccl, tangential_ccl, vertical_ccl, pitch_length, roll_length, yaw_length]
      pdf: [uniform, uniform, uniform, normal, normal, normal, uniform, uniform, uniform]
