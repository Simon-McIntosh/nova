  basis: 'powers of two and their square roots, which is what a binary range ladder in an
    acquisition chain offers. Declared as a hypothesis before any step was classified and
    confirmed by the histogram rather than imposed on it: of 37 steps found, 29 land on a
    rung -- one half 14 times, one over root two 4, root two 5 and two 14.'
