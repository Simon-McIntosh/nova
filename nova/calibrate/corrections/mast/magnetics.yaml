  the pickup pair states and quality states from docs/research/mast-misfit-source-localization.html;
  the flux convention from nova/imas/mast_solve_inputs.py'
generated_at: '2026-08-07'
description: 'Every diagnostic correction the MAST calibration ladder has measured for the
  magnetics system. Gains and acquisition rungs the read path applies; pickup pair states,
  exclusions and quality states measured but not yet applied; one store-to-solver convention.
  Offsets are deliberately absent: every fit measures the pre-excitation baseline from the
  pulse''s own quiet window, so an offset is a per-pulse quantity rather than a set constant.'
ladders:
