id: https://github.com/Simon-McIntosh/nova/schema/diagnostic-correction
name: diagnostic-correction
title: Diagnostic Correction Schema
version: 1.0.0
license: ITER GIP
description: >-
  A diagnostic correction is a function of pulse range, not a constant.  A channel
  holds one calibration state over a run of pulses, steps, holds, and sometimes
  steps back; a single number fitted across such a step is an average of discrete
  states weighted by pulse count, describing no pulse and moving when the pulse
  selection moves.  This schema therefore scopes every correction to a validity
  interval and attaches the evidence that established it, so a consumer reading one
  channel on one pulse can say which correction applies, what warranted it, and
  whether anything warranted it at all.

  One document carries one machine's corrections for one diagnostic system.  The
  read path applies the corrections whose status is promoted, in the order the
  ApplicationStage enum ranks, and reports the rest rather than silently applying
  them: a refusal with a reason is worth more than a silence.

prefixes:
  linkml: https://w3id.org/linkml/
  correction: https://github.com/Simon-McIntosh/nova/schema/diagnostic-correction/
default_prefix: correction
default_range: string

imports:
  - linkml:types

# ---------------------------------------------------------------------------
# enums
# ---------------------------------------------------------------------------

enums:

  CorrectionKind:
    description: >-
      What a correction states about a channel.  The kinds are disjoint by the
      quantity they carry rather than by the fault they describe, because one fault
      can show up as several kinds: a failed pickup pair is a pair_state on the
      pulses where the state is resolved and a quality state where it is not.
    permissible_values:
      gain:
        description: >-
          Scalar multiplier between what the channel reports and the physical
          quantity it measures.  Divided out on the read path.
      acquisition_scale:
        description: >-
          Scalar the acquisition chain applied because of a range setting, constant
          over a block of pulses and quantised onto a declared ladder.  It is not a
          calibration of the sensor: what is divided out is the ladder rung, never
          the measured ratio, because the measured ratio also carries whatever the
          forward description gets wrong about this channel.
      pair_state:
        description: >-
          Which members of a multi-element pickup contributed to the recorded
          signal over an interval.  A channel whose two elements are averaged before
          recording halves when one element fails, so the state is an enumerated
          wiring condition with a nominal multiplier, not a free scalar.
      offset:
        description: >-
          Additive baseline in the channel's own units, removed before any
          multiplicative correction.  Usually measured per pulse from the
          pre-excitation quiet window rather than stored as a set-level constant.
      drift_rate:
        description: >-
          Slope of an integrator's zero in channel units per second, optionally with
          a curvature term, removed as a ramp over the pulse.
      exclusion:
        description: >-
          Instruction to drop the channel from a consumer's fit or read, with a
          stated cause.  Distinct from a quality state: an exclusion is an action,
          a quality state is a description.
      quality:
        description: >-
          Enumerated condition of a channel or a named channel group, with a cause
          and evidence.  Carries the case a fitted correction cannot: a channel that
          is an outlier against its own neighbours in a way no multiplier explains.
      convention:
        description: >-
          Global factor and sign sense relating a stored quantity to the quantity a
          consumer computes, applied at the unit boundary rather than in the
          per-channel chain.

  CorrectionStatus:
    description: >-
      Whether the read path acts on a correction, and if not, why it is nonetheless
      in the document.  Recording the refusals beside the promotions is the point:
      an absent correction cannot be told from an unmeasured one.
    permissible_values:
      promoted:
        description: >-
          Measured, corroborated, and applied by the read path.  Only promoted
          corrections change a value a consumer reads.
      recorded:
        description: >-
          Measured and carried as evidence, but not applied.  The measurement stands;
          promoting it to the read path is a separate decision with its own gate.
      withheld:
        description: >-
          Measured but refused promotion by a stated gate — independent routes that
          disagree, or a value unstable across the channel's own pulse halves.
      refused:
        description: >-
          The measurement is not the quantity the kind names, so no value is carried.
          A block whose step misses every ladder rung is not a range setting, and
          rounding it onto the nearest rung would assert a setting the ladder does
          not support.
      superseded:
        description: >-
          Replaced by a later correction covering the same pulses, kept for the
          record.  This is the one status that may share an interval with another,
          which is why the non-overlap rule is scoped within a status.

  QualityStatus:
    description: Condition of a channel or channel group.
    permissible_values:
      good:
        description: Reads the quantity it names, within its own measured floor.
      suspect:
        description: >-
          Behaves unlike its own neighbours in a way no fitted correction removes.
          Consumers should weight it down or test with and without it; it is not an
          instruction to drop the channel.
      corrupted:
        description: Reads a quantity other than the one it names over the interval.
      dead:
        description: Carries no signal.

  PairState:
    description: >-
      Which elements of a multi-element pickup contributed to a recorded signal.
      MAST equilibrium pickups are two coils 180 degrees apart toroidally whose
      signals are averaged before recording, so the state fixes a nominal
      multiplier on the recorded amplitude.
    permissible_values:
      both_members:
        description: Both elements contributing; nominal multiplier 1.0.
      single_member:
        description: One element contributing; nominal multiplier 0.5.
      recovered:
        description: >-
          A repaired or rewired pickup summing where the acquisition still divides
          by the original element count; nominal multiplier 1.5.
      indeterminate:
        description: >-
          The channel moves between states faster than any interval resolves, so no
          state and no single multiplier describes the interval.  The observed
          states belong in candidate_values.

  ApplicationStage:
    description: >-
      The fixed order the read path applies corrections in, lowest rank first.  A
      correction a consumer cannot order is a correction that will be applied twice
      or not at all, so the order is part of the schema rather than of one consumer.
      Additive terms come out before multiplicative ones; the acquisition scale comes
      out before any sensor gain because the range setting is applied last by the
      instrument and must therefore be removed first among the multipliers; the pair
      state precedes the gain because a fitted gain measured across mixed states is
      itself contaminated by them.
    permissible_values:
      offset:
        description: Subtract the additive baseline.
        rank: 1
      drift:
        description: Subtract the integrator ramp.
        rank: 2
      acquisition_scale:
        description: Divide out the acquisition range rung.
        rank: 3
      pair_state:
        description: Divide out the pickup state's nominal multiplier.
        rank: 4
      gain:
        description: Divide out the channel gain.
        rank: 5
      convention:
        description: >-
          Apply the stored-to-computed factor at the unit boundary, after the
          per-channel chain and never inside it.
        rank: 6

# ---------------------------------------------------------------------------
# slots
# ---------------------------------------------------------------------------

slots:

  machine:
    description: Device the corrections describe.
    required: true

  diagnostic_system:
    description: >-
      Diagnostic the document covers, named as the data-dictionary IDS holding it
      (magnetics, pf_active, ...).  One document per system keeps a correction's
      scope legible from its path.
    required: true

  schema_version:
    description: Version of this schema the document is written against.
    required: true
    pattern: '^\d+\.\d+\.\d+$'

  set_version:
    description: >-
      Monotonic semantic version of the correction set itself, bumped by the author
      when a value, an interval or a status changes.  Semantic and never a content
      hash: a hash orders nothing and tells a consumer nothing about compatibility.
    required: true
    pattern: '^\d+\.\d+\.\d+$'

  generated_by:
    description: What produced the document, specifically enough to run again.
    required: true

  generated_at:
    description: When the document was last written.
    range: date

  description:
    description: What the set covers and what it deliberately leaves out.

  ladders:
    description: Quantisation ladders the set's corrections are validated against.
    range: QuantisationLadder
    multivalued: true
    inlined_as_list: true

  corrections:
    description: Every correction the set carries.
    range: ChannelCorrection
    multivalued: true
    inlined_as_list: true
    required: true

  name:
    description: Identifier of a ladder, unique within the set.
    identifier: true

  kind:
    description: What the correction states.
    range: CorrectionKind
    required: true

  rungs:
    description: >-
      Values a quantised correction of this kind may take, declared as a hypothesis
      before any step is classified so that a measurement missing every rung is
      visible as such instead of being rounded onto one.
    range: float
    multivalued: true
    required: true

  tolerance:
    description: >-
      Fractional distance from a rung, |value - rung| / rung, inside which a value
      is said to land on it.  Wide enough to absorb a channel's own few-percent
      calibration offset riding on the setting, narrow enough that neighbouring
      rungs cannot be confused.
    range: float
    required: true

  basis:
    description: Why these rungs and not others.

  channel:
    description: >-
      Channel the correction applies to, named as the source store names it.
      Exactly one of channel or channel_group is set.

  channel_group:
    description: >-
      Named set of channels the correction applies to — a probe family, a digitiser
      group, a whole array failing together.  Exactly one of channel or
      channel_group is set.

  status:
    description: Whether the read path applies the correction, and if not, why not.
    range: CorrectionStatus
    required: true

  value:
    description: >-
      The quantity the read path uses, in the correction's own units: a multiplier
      for gain, acquisition_scale, pair_state and convention; an additive term for
      offset; a slope for drift_rate.  Absent when the correction carries no value a
      consumer may apply, which every non-promoted kind may be.
    range: float

  measured_value:
    description: >-
      The raw measurement behind the value, kept when the two differ.  An
      acquisition block's measured response ratio carries both the range setting and
      whatever the forward description gets wrong about the channel; only the rung is
      a statement about the acquisition, so the read path divides by the rung and the
      ratio stays here as evidence.
    range: float

  candidate_values:
    description: >-
      Values the quantity was observed to take when no single one describes the
      interval, so a consumer can see the size of what is unresolved rather than
      infer it from a missing value.
    range: float
    multivalued: true

  state:
    description: Pickup state over the interval, for a pair_state correction.
    range: PairState

  quality_status:
    description: Condition of the channel or group, for a quality correction.
    range: QualityStatus

  cause:
    description: >-
      Why the channel is excluded or in this quality state, in mechanism terms.
    range: string

  unit:
    description: >-
      Unit of value and measured_value, omitted when the quantity is a ratio.

  uncertainty:
    description: Interval the value is supported to.
    range: Uncertainty
    inlined: true

  ladder:
    description: >-
      Name of the ladder this correction's value must land on.  Set on a quantised
      kind so validation can reject a free-floating value.

  validity:
    description: >-
      Pulse or time spans the correction holds over.  Corrections that the read path
      would both apply must not overlap, so a value is carried per span and a channel
      that steps carries one correction per era rather than one averaged constant.
    range: ValidityInterval
    multivalued: true
    inlined_as_list: true
    required: true

  provenance:
    description: What established the correction.
    range: Provenance
    inlined: true
    required: true

  notes:
    description: Anything a consumer needs that the structured slots do not carry.

  pulse_start:
    description: First pulse the correction holds on; open below when absent.
    range: integer

  pulse_end:
    description: Last pulse the correction holds on; open above when absent.
    range: integer

  time_start:
    description: First time the correction holds at [s]; open below when absent.
    range: float

  time_end:
    description: Last time the correction holds at [s]; open above when absent.
    range: float

  measured_pulses:
    description: >-
      Pulses the correction was actually measured on, which the span alone does not
      give.  A block running from pulse 14061 to 19258 may rest on thirty-six of the
      five thousand pulses between them, and recording the span alone would let a
      read of pulse 17000 come back measured when nothing measured it.
    range: integer
    multivalued: true

  method:
    description: How the quantity was measured, in enough detail to repeat it.
    required: true

  evidence_uri:
    description: >-
      Where the evidence lives — a research record, a banked array, or the module
      the value was mined from.  Repo-relative paths and URLs are both accepted; what
      matters is that a reader can reach the thing that justified the number.

  fitted_at:
    description: When the measurement was made.
    range: date

  fitted_by:
    description: Who or what made it.

  statement:
    description: What the evidence says, in one sentence.

  corroborations:
    description: >-
      Independent routes to the same quantity.  Kept as structured entries rather
      than prose because which route established a value matters more than how close
      two routes came, and a route that later moves must be findable.
    range: Corroboration
    multivalued: true
    inlined_as_list: true

  lower:
    description: Lower end of the supported interval.
    range: float

  upper:
    description: Upper end of the supported interval.
    range: float

# ---------------------------------------------------------------------------
# classes
# ---------------------------------------------------------------------------

classes:

  CorrectionSet:
    description: >-
      One machine's corrections for one diagnostic system, versioned as a whole.
      The set version moves when any correction in it does, so a consumer can pin a
      calibration the way it pins a code version.
    tree_root: true
    slots:
      - machine
      - diagnostic_system
      - schema_version
      - set_version
      - generated_by
      - generated_at
      - description
      - ladders
      - corrections

  QuantisationLadder:
    description: >-
      The discrete values a quantised correction may take.  Declaring them in the
      document is what lets validation refuse a free-floating value: a step that
      misses every rung is a real step the finder measured, but it is not the
      discrete factor a range setting moves by, and removing it would be a fit
      rather than a correction.
    slots:
      - name
      - kind
      - rungs
      - tolerance
      - basis

  ChannelCorrection:
    description: >-
      One correction, on one channel or channel group, over one or more validity
      intervals.  A channel that holds different states over different pulse ranges
      carries one of these per era.
    slots:
      - channel
      - channel_group
      - kind
      - status
      - value
      - measured_value
      - candidate_values
      - state
      - quality_status
      - cause
      - unit
      - uncertainty
      - ladder
      - validity
      - provenance
      - notes

  ValidityInterval:
    description: >-
      A span of pulses or of time, either end open.  Pulse and time bounds are not
      mixed in one interval: the two cannot be ordered against each other, so an
      interval bounded below in pulse and above in time names nothing.
    slots:
      - pulse_start
      - pulse_end
      - time_start
      - time_end
      - measured_pulses
      - notes

  Provenance:
    description: >-
      What established a correction.  A value without provenance is indistinguishable
      from a guess once the session that produced it is over.
    slots:
      - method
      - evidence_uri
      - fitted_at
      - fitted_by
      - statement
      - corroborations

  Corroboration:
    description: >-
      An independent route reaching the same quantity, recorded beside the value it
      supports rather than in place of it, so a later disagreement between routes is
      visible instead of hidden by whichever was written.
    slots:
      - method
      - value
      - unit
      - uncertainty
      - evidence_uri
      - statement

  Uncertainty:
    description: The interval a value is supported to, in the value's own units.
    slots:
      - lower
      - upper
      - unit
