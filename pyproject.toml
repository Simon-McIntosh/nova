[project]
name = "nova-stella"
dynamic = ["version"]
description = "Equilibrium generation and inference"
license = { text = "ITER GIP" }
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }]
keywords = [
  "equilibrium",
  "generation",
  "reconstruction",
  "inference",
  "plasma",
  "Biot-Savart",
  "mesh-free",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
urls.Homepage = "https://github.com/Simon-McIntosh/nova"
urls.Repository = "https://github.com/Simon-McIntosh/nova"
dependencies = [
  "appdirs>=1.4.4",
  "contourpy>=1.3",
  "fsspec>=2024.10",
  "gitpython>=3.1.31",
  "h5py>=3.10",
  "imas-python>=2.0",
  "netcdf4>=1.7",
  "numpy>=2",
  "packaging>=23.2",
  # Diagnostic-correction documents are read through the models generated from
  # their LinkML schema; the generators themselves live in the schema extra.
  "pydantic>=2.9",
  "pyquaternion>=0.9.9",
  "pyyaml>=6",
  "scipy>=1.14",
  "shapely>=2.0.1",
  "tqdm>=4.66.1",
  "xarray>=2024.10",
  "xxhash>=3.2.0",
  "zarr>=3",
]

[project.optional-dependencies]
bokeh = ["bokeh>=3.6"]
# Standard-name semantics for the zarr signal store live in the managed
# imas-standard-names (name API, pint units) + imas-standard-names-catalog
# (data-only SQLite catalog). Both are isolated behind this extra: ISN
# currently hard-depends on fastmcp, which drags an MCP server stack
# (starlette/uvicorn/httpx/authlib) that the store consumers -- name lookup
# and units only -- never touch. nova.io imports gate on this extra so the
# core import graph stays free of the server stack. Pinned to the fork RCs
# converging on the first upstream release; flip to PyPI ranges on release.
io = [
  "imas-standard-names @ git+https://github.com/Simon-McIntosh/IMAS-Standard-Names.git@v0.8.0rc56",
  "imas-standard-names-catalog @ git+https://github.com/Simon-McIntosh/imas-standard-names-catalog.git@v0.2.0rc64",
]
# dolfinx itself is conda/spack-provisioned (no PyPI wheels); this extra
# carries only the pip-installable meshing stack the fenics examples use
fenics = ["gmsh>=4.12", "pygmsh>=7.1"]
interchange = ["openpyxl>=3.1.5", "pandas>=2.2"]
mast = ["intake>=2", "scikit-learn>=1.5"]
naka = ["beautifulsoup4>=4.12", "mechanize>=0.4"]
jax = ["jax>=0.5"]
gpu = ["jax[cuda12]>=0.5; sys_platform == 'linux'"]
matplotlib = ["matplotlib>=3.10", "seaborn>=0.13"]
numba = ["numba>=0.61"]
# LinkML authoring toolchain: generates the Pydantic models and the JSON-Schema
# export from nova/calibrate/schema. Both generated files are committed, so
# reading a correction document needs none of this.
schema = ["linkml>=1.9"]
test = [
  "nova-stella[jax]",
  "matplotlib>=3.10",
  "meshio>=5.3.4",
  "networkx",
  "pyvista>=0.44",
  "pytest",
  "pytest-cov>=4.1.0",
  "pytest-asyncio>=0.21.1",
  "scikit-learn>=1.5",
  "trimesh>=4",
  "vedo>=2024.5.0",
]
thermofluids = [
  "coolprop>=6.6.0",
  "ftputil>=5.0.4",
  "nlopt>=2.7",
  "openpyxl>=3.1.2",
  "pymupdf>=1.24",
  "regex>=2024",
  "tables>=3.8.0",
  "xlrd>=2.0.1",
]
viz = [
  "alphashape>=1.3.1",
  "meshio>=5.3.4",
  "pyvista>=0.44",
  "scikit-learn>=1.5",
  "trimesh>=4",
  "vedo>=2024.5.0",
]

[dependency-groups]
dev = [
  # Code formatting and linting
  "black>=23.0.0",
  "ruff>=0",
  "mypy>=1.15.0,<1.17.0",
  "pre-commit>=4.2.0",
  "tqdm-stubs>=0.2.1",
  # Benchmark harness (asv suite under benchmarks/)
  "asv>=0.6",
  # Interactive development
  "ipython>=9.2.0",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.7",
]

[project.scripts]
benchmark = "nova.scripts.benchmark:benchmark"
extrapolate = "nova.imas.scripts:extrapolate"
filepath = "nova.database.scripts:filepath"
configure = "nova.scripts.configure:configure"
mast-machine-artifact = "nova.scripts.mast_machine_artifact:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The io extra pins the standard-name forks by git tag until they release to
# PyPI; hatchling rejects direct (git-URL) references in dependencies without
# this opt-in. Drops out when the pins flip to PyPI ranges on upstream release.
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
# only numeric release tags carry versions; skip marker tags like v1-assembly-baseline
git_describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "[0-9]*.[0-9]*",
]

[tool.hatch.build.hooks.vcs]
version-file = "nova/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["nova"]

[tool.black]
line-length = 88
target-version = ['py314']

[tool.ruff]
target-version = "py314"
line-length = 88

exclude = [
  "examples",
  "tests",
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  "build",
  "dist",
]

lint.select = ["E", "F"]
lint.ignore = []

# Written verbatim by `gen-pydantic` from the LinkML schema beside it and
# committed so that reading a correction document needs no toolchain. The
# generator emits one long line per slot and a fixed import block it does not
# prune, neither of which a hand edit may fix: the file is regenerated and
# compared byte for byte by the test suite.
lint.per-file-ignores = { "nova/calibrate/correction_model.py" = ["E501", "F401"] }

lint.fixable = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "G",
  "I",
  "N",
  "Q",
  "S",
  "T",
  "W",
  "ANN",
  "ARG",
  "BLE",
  "COM",
  "DJ",
  "DTZ",
  "EM",
  "ERA",
  "EXE",
  "FBT",
  "ICN",
  "INP",
  "ISC",
  "NPY",
  "PD",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLF",
  "TCH",
  "TID",
  "TRY",
  "UP",
  "YTT",
]
lint.unfixable = []
lint.dummy-variable-rgx = ">=(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

lint.mccabe.max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Default invocation is the fast lane: everything except tests marked `slow`.
# Run the whole suite with `pytest -m "slow or not slow"` (the command-line -m
# overrides the one prepended here).
addopts = "-rfEs --doctest-modules -m 'not slow'"
norecursedirs = ".git __pycache__"
markers = [
  "slow: heavy tests excluded from the default fast lane (numerical sweeps, jax jit/vmap/grad, signal-store round-trips, structural solves, live-data integration); run them with `pytest -m \"slow or not slow\"`",
]
testpaths = [
  "tests",
  "nova/imas/database.py",
  "nova/imas/equilibrium.py",
  "nova/imas/extrapolate.py",
  "nova/imas/machine.py",
  "nova/imas/operate.py",
  "nova/imas/pulsedesign.py",
]
filterwarnings = [
  "once::Warning",
  "ignore:open:DeprecationWarning:imas",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = false
ignore_missing_imports = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["imas", "imaspy"]
ignore_missing_imports = true

[tool.pylsp-mypy]
enabled = true
live_mode = true
dmypy = false
strict = false

[tool.coverage.run]
branch = true
omit = [
  "nova/scripts/*",
  "nova/utilities/*",
]

[tool.coverage.report]
ignore_errors = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
