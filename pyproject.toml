[project]
name = "nova-stella"
dynamic = ["version"]
description = "Equilibrium generation and inference"
license = { text = "ITER GIP" }
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }]
keywords = [
  "equilibrium",
  "generation",
  "reconstruction",
  "inference",
  "plasma",
  "Biot-Savart",
  "mesh-free",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
]
urls.Homepage = "https://github.com/Simon-McIntosh/nova"
urls.Repository = "https://github.com/Simon-McIntosh/nova"
dependencies = [
  "appdirs>=1.4.4",
  "contourpy>=1.3",
  "fsspec>=2024.10",
  "h5py>=3.10",
  "imas-python>=2.0",
  "netcdf4>=1.7",
  "numpy>=2",
  "packaging>=23.2",
  "pyquaternion>=0.9.9",
  "scipy>=1.14",
  "shapely>=2.0.1",
  "tqdm>=4.66.1",
  "xarray>=2024.10",
  "xxhash>=3.2.0",
  "zarr>=3",
]

[project.optional-dependencies]
bokeh = ["bokeh>=3.6"]
interchange = ["openpyxl>=3.1.5", "pandas>=2.2"]
jax = [
  "jax[cuda12]>=0.5; sys_platform == 'linux'",
  "jax>=0.5; sys_platform != 'linux'",
]
matplotlib = ["matplotlib>=3.10"]
numba = ["numba>=0.61"]
test = ["pytest", "pytest-cov>=4.1.0", "pytest-asyncio>=0.21.1"]
viz = [
  "alphashape>=1.3.1",
  "meshio>=5.3.4",
  "pyvista>=0.44",
  "trimesh>=4",
  "vedo>=2024.5.0",
]

[dependency-groups]
dev = [
  # Code formatting and linting
  "black>=23.0.0",
  "ruff>=0",
  "mypy>=1.15.0,<1.17.0",
  "pre-commit>=4.2.0",
  "tqdm-stubs>=0.2.1",
  # Interactive development
  "ipython>=9.2.0",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.7",
]

[project.scripts]
benchmark = "nova.scripts.benchmark:benchmark"
extrapolate = "nova.imas.scripts:extrapolate"
filepath = "nova.database.scripts:filepath"
configure = "nova.scripts.configure:configure"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"
# only numeric release tags carry versions; skip marker tags like v1-assembly-baseline
git_describe_command = [
  "git",
  "describe",
  "--dirty",
  "--tags",
  "--long",
  "--match",
  "[0-9]*.[0-9]*",
]

[tool.hatch.build.hooks.vcs]
version-file = "nova/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["nova"]

[tool.black]
line-length = 88
target-version = ['py314']

[tool.ruff]
target-version = "py314"
line-length = 88

exclude = [
  "tests",
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  "build",
  "dist",
]

lint.select = ["E", "F"]
lint.ignore = []

lint.fixable = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "G",
  "I",
  "N",
  "Q",
  "S",
  "T",
  "W",
  "ANN",
  "ARG",
  "BLE",
  "COM",
  "DJ",
  "DTZ",
  "EM",
  "ERA",
  "EXE",
  "FBT",
  "ICN",
  "INP",
  "ISC",
  "NPY",
  "PD",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLF",
  "TCH",
  "TID",
  "TRY",
  "UP",
  "YTT",
]
lint.unfixable = []
lint.dummy-variable-rgx = ">=(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

lint.mccabe.max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-rfEs --doctest-modules"
norecursedirs = ".git __pycache__"
testpaths = [
  "tests",
  "nova/imas/database.py",
  "nova/imas/equilibrium.py",
  "nova/imas/extrapolate.py",
  "nova/imas/machine.py",
  "nova/imas/operate.py",
  "nova/imas/pulsedesign.py",
]
filterwarnings = [
  "once::Warning",
  "ignore:open:DeprecationWarning:imas",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = false
ignore_missing_imports = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["imas", "imaspy"]
ignore_missing_imports = true

[tool.pylsp-mypy]
enabled = true
live_mode = true
dmypy = false
strict = false

[tool.coverage.run]
branch = true
omit = [
  "nova/scripts/*",
  "nova/utilities/*",
]

[tool.coverage.report]
ignore_errors = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]
