[project]
name = "nova-stella"
dynamic = ["version"]
description = "Equilibrium generation and inference"
license = { text = "ITER GIP" }
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Simon McIntosh", email = "simon.mcintosh@iter.org" }]
keywords = [
  "equilibrium",
  "generation",
  "reconstruction",
  "inference",
  "plasma",
  "Biot-Savart",
  "mesh-free",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: Other/Proprietary License",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
urls.Homepage = "https://git.iter.org/projects/EQ/repos/nova/"
urls.Repository = "https://git.iter.org/projects/EQ/repos/nova/"
dependencies = [
  "alphashape>=1.3.1",
  "appdirs>=1.4.4",
  "bokeh>=3.1.1",
  "contourpy>=1.0.7",
  "descartes>=1.1.0",
  "fsspec>=2023.5.0",
  "gitpython>=3.1.31",
  "matplotlib>=3.7.1",
  "meshio>=5.3.4",
  "moviepy>=1.0.3",
  "netcdf4>=1.6.3",
  "networkx>=3.1",
  "numpy (>=1.26,<2.0.0)",
  "overrides>=7.4.0",
  "packaging>=23.2",
  "pandas<2.2.0",
  "pillow>=12.3.0",
  "pyquaternion>=0.9.9",
  "pyvista>=0.39.1",
  "seaborn>=0.12.2",
  "scipy>=1.10.1",
  "scikit-learn>=1.2.2",
  "shapely>=2.0.1",
  "tqdm>=4.66.1",
  "trimesh>=3.21.7",
  "vedo>=2023.5.0",
  "xarray>=2023.5.0",
  "xxhash>=3.2.0",
  "optax (>=0.2.3,<0.3.0)",
  "optimistix (>=0.0.7,<0.0.8)",
  "altair (>=5.5.0,<6.0.0)",
  "openpyxl>=3.1.5",
  "rich>=14.1.0",
]

[project.optional-dependencies]
ansys = [
  "ansys-dpf-core>=0.8.1",
  "ansys-dpf-post>=0.4.0",
  "fortranformat>=1.2.2",
  "openpyxl>=3.1.2",
]
bamboo = ["coverage2clover>=4.0.0", "tox>=4.6.4"]
imas = [
  "imas-python",
  #"imas-core @ git+ssh://git@git.iter.org/imas/al-core.git",
  "h5py>=3.10.0",
]
jit = [
  "jax[cpu]==0.4.27",     # cuda12_local
  "numba>=0.59.0",
  "tbb>=2021.11.0",
  "tbb-devel>=2021.11.0",
]
# naka = ["nakamap @ git+https://github.com/Simon-McIntosh/nakamap.git"]
optimize = ["jaxopt>=0.8.3", "pylops>=2.1.0"]
test = ["pytest", "pytest-cov>=4.1.0", "pytest-asyncio>=0.21.1"]
thermofluids = [
  "coolprop>=6.6.0",
  "ftputil>=5.0.4",
  "matplotlib>=3.7.1",
  "openpyxl>=3.1.2",
  "tables>=3.8.0",
  "xlrd>=2.0.1",
]
uda = ["nest-asyncio>=1.5.8", "async-property>=0.2.2"]

[dependency-groups]
dev = [
  # Code formatting and linting
  "black>=23.0.0",
  "ruff>=0",
  "mypy>=1.15.0,<1.17.0",
  "pre-commit>=4.2.0",
  "tqdm-stubs>=0.2.1",
  # Interactive development
  "ipython>=9.2.0",
  "ipykernel>=6.29.5",
  "ipywidgets>=8.1.7",
]

[project.scripts]
benchmark = "nova.scripts.benchmark:benchmark"
extrapolate = "nova.imas.scripts:extrapolate"
filepath = "nova.database.scripts:filepath"
configure = "nova.scripts.configure:configure"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "post-release"

[tool.hatch.build.hooks.vcs]
version-file = "nova/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["nova"]
exclude = [
  "nova/ansys",
  "nova/assembly",
  "nova/design",
  "nova/development",
  "nova/dina",
  "nova/projects",
  "nova/structural",
  "nova/thermalhydralic",
]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 88

exclude = [
  "design",
  "development",
  "dina",
  "projects",
  "structural",
  "thermalhydralic",
  "tests",
  ".git",
  ".mypy_cache",
  ".ruff_cache",
  ".tox",
  "build",
  "dist",
]

lint.select = ["E", "F"]
lint.ignore = []

lint.fixable = [
  "A",
  "B",
  "C",
  "D",
  "E",
  "F",
  "G",
  "I",
  "N",
  "Q",
  "S",
  "T",
  "W",
  "ANN",
  "ARG",
  "BLE",
  "COM",
  "DJ",
  "DTZ",
  "EM",
  "ERA",
  "EXE",
  "FBT",
  "ICN",
  "INP",
  "ISC",
  "NPY",
  "PD",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "RET",
  "RSE",
  "RUF",
  "SIM",
  "SLF",
  "TCH",
  "TID",
  "TRY",
  "UP",
  "YTT",
]
lint.unfixable = []
lint.dummy-variable-rgx = ">=(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

lint.mccabe.max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-rfEs --doctest-modules --ignore=tests/test_sultan.py"
norecursedirs = ".git __pycache__"
testpaths = [
  "tests",
  "nova/imas/database.py",
  "nova/imas/equilibrium.py",
  "nova/imas/extrapolate.py",
  "nova/imas/machine.py",
  "nova/imas/operate.py",
  "nova/imas/pulsedesign.py",
]
filterwarnings = [
  "once::Warning",
  "ignore:open:DeprecationWarning:imas",
  "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning:dateutil",             # pandas <2.2 
  "ignore:the matrix subclass is not the recommended:PendingDeprecationWarning:numpy", # alphashape
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = false
ignore_missing_imports = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["imas", "imaspy"]
ignore_missing_imports = true

[tool.pylsp-mypy]
enabled = true
live_mode = true
dmypy = false
strict = false

[tool.coverage.run]
branch = true
omit = [
  "nova/ansys/*",
  "nova/assembly/*",
  "nova/design/*",
  "nova/development/*",
  "nova/dina/*",
  "nova/obsolete/*",
  "nova/projects/*",
  "nova/scripts/*",
  "nova/thermalhydralic/*",
  "nova/utilities/*",
]

[tool.coverage.report]
ignore_errors = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]


